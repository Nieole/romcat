rail-width        = 196   # 左侧导航展开宽度
rail-collapsed    = 68    # 左侧导航收起后的宽度
rail-collapse-below = 800 # 窗口宽不到这么多时左栏自动收成窄条（拿主意的人 2026-09-14 定；设计稿里没有，check_tokens.py 不核）。
                          # 这么算出来的：左栏展开 196 时，浏览屏筛选栏最多吃窗口宽的 35%、详情栏最少 200、正中至少留 120
