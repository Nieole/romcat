# romcat 界面的颜色与尺寸参数（令牌）
#
# **数据不是代码**：与核心库的 platforms.toml / profiles.toml / priorities.toml 同一条纪律，
# `include_str!` 编进二进制（crates/gui/src/tokens.rs），运行时不读盘。
#
# 这份文件是设计稿与界面共用的**唯一**来源，全仓库只有这一份：
# - 界面：crates/gui/src/look.rs 从这里装亮暗两套 Visuals 与字号、圆角，那儿的测试逐项比对，
#   偏一项门禁就红；
# - 设计稿：.scratch/gui-looks-like-the-design/check_tokens.py 读这一份，核对 prototype.html
#   顶部的 CSS 变量。
# 改颜色只改这里；再跑一遍 check_tokens.py，把设计稿那边对齐。
#
# 读得严：少一项、多一项、颜色写法不对，程序当场报错并说出是哪一项。
# 颜色一律写 #RRGGBB（半透明的写 #RRGGBBAA，未预乘）。键名与 CSS 变量同名（去掉前缀 --）。
# 键名是稳定接口：后面每一屏都按这些名字取值，改名等于改接口。

version = 1

# ── 浅色主题 ──────────────────────────────────────────────
[color.light]
ground      = "#E8ECF1"   # 窗口外的底色（设计稿页面背景，不进 egui）
win         = "#F6F7F9"   # 窗口底色：侧栏、页面头
panel       = "#FFFFFF"   # 面板、卡片、对话框
panel-2     = "#F0F2F6"   # 面板里的次级底色：表头、分组头
sunken      = "#E5E9EF"   # 凹陷区：进度条槽、代码块
ink         = "#161A21"   # 正文
ink-2       = "#465063"   # 次要文字
ink-3       = "#677185"   # 说明文字（在 panel 上对比度 ≥ 4.5）
ink-4       = "#A3AAB7"   # 占位、禁用
line        = "#DCE1E8"   # 1 像素描边、分隔线
line-2      = "#C6CDD9"   # 输入框描边、强一级的分隔
accent      = "#3E4EC6"   # 强调色：主按钮、选中、焦点
accent-hover = "#3240AE"
accent-soft = "#E4E7FA"   # 选中行、选中分面的底色
accent-ink  = "#2D3AA3"   # 强调色上的文字 / 强调色的文字形态
on-accent   = "#FFFFFF"   # 主按钮上的文字
hi          = "#0A785C"   # 高置信 / 成功
hi-soft     = "#DBF0E8"
mid         = "#985F00"   # 中置信 / 提醒
mid-soft    = "#F7EAD3"
lo          = "#B0392F"   # 低置信 / 错误 / 危险操作
lo-soft     = "#F9E1DE"
none        = "#6E7788"   # 没有候选 / 中性
none-soft   = "#E6E9EE"
scrim       = "#0C0F158C" # 对话框遮罩（rgba(12,15,21,.55)）
pop-color   = "#10141E73" # 弹层、弹出菜单的阴影（设计稿 --pop 里那一色 rgba(16,20,30,.45)）

# ── 深色主题 ──────────────────────────────────────────────
[color.dark]
ground      = "#07090D"
win         = "#101318"
panel       = "#161A21"
panel-2     = "#1B2028"
sunken      = "#0C0F14"
ink         = "#E5E9F0"
ink-2       = "#A8B1BF"
ink-3       = "#858F9E"
ink-4       = "#4D5563"
line        = "#242A34"
line-2      = "#323A47"
accent      = "#8190F6"
accent-hover = "#9AA6F8"
accent-soft = "#1F2547"
accent-ink  = "#A7B1FA"
on-accent   = "#0D1030"
hi          = "#3FBF9C"
hi-soft     = "#112E27"
mid         = "#DBA243"
mid-soft    = "#302415"
lo          = "#EC7C70"
lo-soft     = "#371E1B"
none        = "#7B8595"
none-soft   = "#1F242D"
scrim       = "#00000099" # rgba(0,0,0,.6)
pop-color   = "#10141E73" # 设计稿暗色没有另写 --pop，照亮色那一份

# ── 平台色：两套主题共用；卡片平台标签、字卡底色、平台色块取这里 ──
[color.platform]
FC  = "#C23B30"
SFC = "#6A5ACD"
GB  = "#7D9A1E"
GBC = "#D0632B"
GBA = "#4453C4"
NDS = "#6F7A8C"
PSP = "#3B4252"
PSV = "#2A6BD1"
PS1 = "#565C6B"
MD  = "#2B2F3A"
PS2 = "#2F4DA0"
NGC = "#6B4FB8"
other = "#555555"         # 表里没有的平台

# ── 视频格上的播放标：两套主题共用 ──
# 它压在一帧视频画面上，不压在界面底色上，画面多亮多暗与主题无关。
# 设计稿里没有这两格的 CSS 变量，check_tokens.py 不核它们。
[color.video]
shade = "#00000050"       # 压在首帧上的那层半透明底
mark  = "#FFFFFF"         # 底上的 ▶

# ── 尺寸（逻辑像素，egui 的 points） ──────────────────────
[radius]
small  = 4    # 分面、标签、小按钮
medium = 6    # 按钮、输入框、列表项
large  = 10   # 面板、卡片、对话框

[font]
sans = ["PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans SC"]   # egui 打包 Noto Sans SC
mono = ["SF Mono", "JetBrains Mono", "Cascadia Mono", "Menlo", "Consolas"]           # egui 打包一份只含拉丁字符的等宽字体
# 字体预算（裁定 2026-09-13）：只打包一份**拉丁与数字**的粗体，中文一律常规字重。
# 于是「粗体」只对拉丁字母和数字生效，中文的层次靠字号、颜色和间距拉开；
# egui 侧不要开字重合成（font_synthesis 关掉），否则会画出假粗体。
bold-coverage = "latin-digits-only"
weight-regular = 400
weight-strong  = 600
size-caption = 11     # 角标、分组标题
size-caption-plus = 11.5   # 表头、图例（稿 11.5）
size-small   = 12     # 说明文字、表格副行
size-small-plus = 12.5   # 屏头说明、表格行（稿 12.5）
size-body    = 13     # 正文、按钮
size-title   = 15     # 卡片标题、对话框标题
size-page    = 18     # 页面标题
size-hero    = 24     # 作品详情页的大标题
size-mini    = 10.5   # 分面标签里的条数（设计稿 .fchip small）
size-path    = 11     # 等宽的路径（设计稿 .w2 / .var .p）
size-detail-title = 17  # 侧边详情头上的标题（设计稿 .dpane h3）
size-thumb-code   = 9   # 行首封面格里的平台代号（设计稿 .lthumb i）
size-cover-title  = 12  # 侧边详情字卡上的标题（设计稿 .dcover .tc-t）
size-cover-mark   = 40  # 侧边详情字卡上的平台代号水印（设计稿 .dcover .tc-wm）
size-arrow        = 10  # 表头上排序那枚小箭头（设计稿 .wtbl th .sa）
size-panel-title = 14 # 面板标题（设计稿 .phead h3）
size-empty-title = 16 # 子库屏空态那张卡的标题（设计稿空态卡 h3 的 font-size:16px）
line-height  = 1.55
size-badge-narrow = 10    # 左栏收成窄条后入口底下那个计数（设计稿 .main.rcol .nav .badge 的 10px）
group-tracking    = 0.08  # 左栏分组标题的字距，字号的倍数（设计稿 .grp 的 letter-spacing:.08em）
size-button-large = 14    # 大号按钮上的字（设计稿 .btn.lg 的 font-size:14px）

[space]
steps = [4, 8, 12, 16, 20]   # 通用间距的档位；设计稿上写死的字面值不凑进档位，另立下面那些具名令牌
panel-padding  = [11, 14]    # 面板标题栏内边距（上下, 左右）
dialog-padding = [20, 22]    # 对话框内容区内边距（上下, 左右）
cell-padding   = [8, 10]     # 表格单元格内边距
opening-hero-padding = [56, 48]   # 开场左栏内边距（上下, 左右）
opening-side-padding = [40, 36]   # 开场右栏内边距（上下, 左右）
catalog-row-padding  = [12, 14]   # 开场主库列表每一行的内边距（上下, 左右）（设计稿 .catrow 的 padding:12px 14px）
catalog-row-gap      = 2          # 那一行里名字与底下那句之间的竖向间距（设计稿 .catrow 的 gap:2px）
filter-pane-padding  = 12         # 浏览屏左栏内边距（设计稿 .fpane 的 padding:12px）
detail-pane-padding  = 16         # 浏览屏右栏内边距（设计稿 .dpane 的 padding:16px）
pane-gap             = 14         # 左右两栏里一段与一段之间（设计稿 .fpane / .dpane 的 gap:14px）
facet-gap            = 5          # 一簇分面标签之间（设计稿 .facet 的 gap:5px）
facet-chip-gap       = 6          # 分面标签里名字与条数之间（设计稿 .fchip 的 gap:6px）
note-padding         = [9, 12]    # 提示框内边距（上下, 左右）（设计稿 .note）
variant-card-padding = [9, 10]    # 侧边详情变体卡片内边距（上下, 左右）（设计稿 .var）
list-bar-padding     = [8, 14]    # 表格上方「列表」那一条的内边距（上下, 左右）（设计稿 .cbar）
table-head-padding   = [7, 10]    # 表头一格的内边距（上下, 左右）（设计稿 .tbl th 的 padding:7px 10px）：浏览屏表头、任务屏历史表头
empty-padding        = 28         # 空态那一块的留白（设计稿 .empty 的 padding:28px）：浏览屏筛空、任务屏空台
thumb-gap            = 7          # 侧边详情媒体格之间（设计稿 .thumbs 的 gap:7px）
detail-head-gap      = 12         # 侧边详情头上封面与字之间（设计稿 .dhead 的 gap:12px）
title-card-padding   = [9, 8]     # 侧边详情字卡内边距（上下, 左右）（设计稿 .dcover .tcard）
rule-box-padding     = 10         # 条件组那个框的内边距（设计稿 .gtree 的 padding:10px）
rule-text-padding    = [6, 8]     # 规则原文那一条的内边距（上下, 左右）（设计稿 .ruletext）
section-gap          = 6          # 一段里小标题与底下内容之间（设计稿 .fpane / .dpane 里 .col 的 gap:6px）
variant-card-gap     = [3, 8]     # 变体卡片里上下两行之间、左右两块之间（设计稿 .var 的 gap:3px 8px）
strip-padding        = 10         # 收起那一栏的窄条上下留白（设计稿 .strip 的 padding:10px 0）
strip-gap            = 12         # 窄条上那颗箭头与竖排栏名之间（设计稿 .strip 的 gap:12px）
table-cell-padding   = 10         # 表格一格左右留白（设计稿 .wtbl td 的 padding:0 10px）
cell-gap             = 10         # 表格「作品」那一格里行首封面与字之间（设计稿 .wcell 的 gap:10px）
list-bar-gap         = 10         # 「列表」那一条里几样东西之间（设计稿 .cbar 的 gap:10px）
sort-arrow-gap       = 3          # 表头上的字与排序箭头之间（设计稿 .wtbl th .sa 的 margin-left:3px）
panel-head-gap       = 10         # 面板标题栏里标题、说明、按钮之间的横向间距（设计稿 .phead 的 gap:10px）
library-gap          = 18         # 库屏两栏之间、右栏几块之间的间距（设计稿 .libgrid 的 gap:18px）
screen-header-padding = [14, 20]  # 屏头的内边距（上下, 左右）（设计稿 .scrhead 的 padding:14px 20px）
screen-header-gap     = 12        # 屏头里标题、副标题、右侧那一段彼此隔多远（设计稿 .scrhead 的 gap:12px）
screen-body-padding   = [18, 20, 28]  # 屏体的内边距（上, 左右, 下）（设计稿 .scrbody 的 padding:18px 20px 28px）
rail-padding           = [10, 8]      # 左栏的内边距（上下, 左右）（设计稿 .rail 的 padding:10px 8px）
rail-padding-collapsed = [10, 6]      # 左栏收成窄条后的内边距（设计稿 .main.rcol .rail 的 padding:10px 6px）
rail-gap               = 2            # 左栏里一项与下一项隔多远（设计稿 .rail 的 gap:2px）
rail-switch-padding    = [8, 9]       # 左栏顶上切换主库那张卡的内边距（上下, 左右）（设计稿 .libsw 的 padding:8px 9px）
rail-switch-gap        = 9            # 那张卡里标志与字之间（设计稿 .libsw 的 gap:9px）
rail-switch-margin     = 6            # 那张卡底下再空多少（设计稿 .libsw 的 margin-bottom:6px）
rail-group-padding     = [12, 10, 4]  # 左栏分组标题的内边距（上, 左右, 下）（设计稿 .grp 的 padding:12px 10px 4px）
rail-group-margin-collapsed = [8, 6]  # 收成窄条后分组标题变成一道线，线四周空多少（上下, 左右）（设计稿 .main.rcol .grp 的 margin:8px 6px）
nav-padding            = 10           # 左栏入口左右留白（设计稿 .nav 的 padding:0 10px）
nav-padding-collapsed  = 7            # 收成窄条后入口上下留白（设计稿 .main.rcol .nav 的 padding:7px 0）
nav-gap-collapsed      = 1            # 收成窄条后入口的字与计数之间（设计稿 .main.rcol .nav 的 gap:1px）
live-badge-gap         = 5            # 任务跑着时入口计数前那枚圆点与数之间（设计稿 .nav .badge.live 的 gap:5px）
rail-foot-gap          = 6            # 左栏栏底几样之间（设计稿 .railfoot 的 gap:6px）
rail-foot-padding      = 10           # 栏底那道线底下空多少（设计稿 .railfoot 的 padding-top:10px）
rail-note-padding      = 10           # 栏底「已保存 N 条裁决」那一行左右留白（设计稿 .railfoot .st 的 padding:0 10px）
rail-note-gap          = 6            # 那一行圆点与字之间（设计稿 .railfoot .st 的 gap:6px）
screen-section-gap   = 18            # 屏体里一块与一块之间（设计稿任务屏 .scrbody.col 的 gap:18px）
section-title-gap    = 8             # 小标题与底下那一块之间（设计稿任务屏 .col 的 gap:8px）
card-padding         = 16            # 正在跑那张卡的内边距（设计稿 .runcard 的 padding:16px）
card-row-gap         = 8             # 那张卡里一排与一排之间（设计稿 .runcard 的 gap:8px 16px 竖向那一半）
queue-row-padding    = [10, 14]      # 等待中那一行卡片的内边距（上下, 左右）（设计稿 renderTasks 那张卡的 padding:10px 14px）
meta-gap             = 18            # 正在跑那张卡底下那一排，格与格之间（设计稿 .runcard .meta 的 gap:18px）

[layout]
rail-width        = 196   # 左侧导航展开宽度
rail-collapsed    = 68    # 左侧导航收起后的宽度
rail-collapse-below = 800 # 窗口宽不到这么多时左栏自动收成窄条（拿主意的人 2026-09-14 定；设计稿里没有，check_tokens.py 不核）。
                          # 这么算出来的：左栏展开 196 时，浏览屏筛选栏最多吃窗口宽的 35%、详情栏最少 200、正中至少留 120
                          # （crates/gui/src/layout.rs 的 FILTER / DETAIL / FLOOR），于是要 0.65·宽 − 196 ≥ 320，即宽 ≥ 794，取整到 800。
                          # 那三个数一改，这个数跟着重算；layout.rs 的测试钉着「门槛上摆得开、窄 10 点摆不开」。
rail-mark         = 26    # 左栏顶上切换主库那张卡上标志的边长（设计稿 .libsw .mark 的 26px）
nav-height        = 32    # 左栏入口的高（设计稿 .nav 的 height:32px）
rail-dot          = 7     # 左栏里那两枚圆点的直径：任务跑着时、栏底裁决数前（设计稿 .nav .badge.live::before 与 .railfoot .st::before 的 7px）
strip-width       = 36    # 面板折叠后的窄条
filter-pane-width = 232   # 浏览页筛选栏
detail-pane-width = 296   # 浏览页侧边详情
table-row         = 46    # 作品表格行高（等高行）
table-row-cover   = 58    # 打开「在每行开头显示封面」后的行高
tier-bar          = 3     # 置信度色条宽度
thumb-list        = [32, 43] # 列表行首封面缩略图（宽, 高）
card-cover-ratio  = 0.75  # 卡片封面宽高比 3:4
statusbar         = 30    # 底部状态栏高度
statusbar-bar     = 120   # 底部状态栏里任务那条小进度条的宽度
runcard-bar       = 3     # 正在跑那张卡左边那条强调色竖条的宽（设计稿 .runcard 的 box-shadow:inset 3px 0 0）
runcard-progress  = 8     # 正在跑那张卡上进度条的高（设计稿 .runcard .bar 的 height:8px）
dialog-width      = [520, 620, 720, 840]   # 对话框只用这几档宽度
opening-side-width = [440, 560]  # 开场右栏宽度（最窄, 最宽）
opening-hero-min  = 360   # 开场左栏最窄宽度
mark              = 44    # 开场左上角那枚标志的边长
promise-icon      = 28    # 开场三条承诺前那枚字块的边长
page-dot          = 20    # 弹层标头「走到第几问」那一圈的直径
chip-dot          = 6     # 标签左边那枚圆点的直径（设计稿 .chip::before 与 .ro::before 的 6px）
chip-height       = 20    # 标签的高（设计稿 .chip 的 height:20px）
chip-padding      = 7     # 标签左右留白（设计稿 .chip 的 padding:0 7px）
chip-gap          = 5     # 标签里圆点与字之间（设计稿 .chip 的 gap:5px）
ro-height         = 22    # 只读标签的高（设计稿 .ro 的 height:22px；圆点直径与标签共用 chip-dot，字取 size-small）
ro-padding        = 9     # 只读标签左右留白（设计稿 .ro 的 padding:0 9px）
ro-gap            = 6     # 只读标签里圆点与字之间（设计稿 .ro 的 gap:6px）
kv-key-width      = 84    # 「名 → 值」两列排时名那一列的宽
button-height     = 28    # 按钮的高（设计稿 .btn）：弹层页脚、「选择…」
button-padding    = 12    # 按钮左右留白（设计稿 .btn 的 padding:0 12px）
button-small-height  = 24 # 小号按钮的高（设计稿 .btn.sm）：行内「打开」、抬头上的「添加主库」「更改…」
button-small-padding = 9  # 小号按钮左右留白（设计稿 .btn.sm 的 padding:0 9px）
button-large-height = 36  # 大号按钮的高（设计稿 .btn.lg）：开场空态那一颗「添加主库」
button-large-padding = 18 # 大号按钮左右留白（设计稿 .btn.lg 的 padding:0 18px）
control-stroke    = 1     # 控件（按钮、输入框、勾选框）描边的宽：四档一样宽，颜色取各档自己那一格（设计稿 .btn / .input 的 1px）
input-height      = 28    # 单行输入框的高：与同一行默认那一档按钮等高（拿主意的人 2026-09-14 第三次裁；设计稿 .input 是 30，不照它）
input-small-height = 24   # 小号单行输入框的高：与小号按钮等高（开场贴路径那一框，旁边是小号的「换过去」）
input-padding     = 10    # 单行输入框左右留白（设计稿 .input 的 padding:0 10px）
icon-button       = 24    # 图标按钮的边长（设计稿 .iconbtn 的 24px）：浏览屏收起、展开那两颗箭头，库屏面板标题栏里那枚折叠标，子库屏规则行尾那颗「×」「✎」
facet-chip-height = 24    # 分面标签的高（设计稿 .fchip）
facet-chip-padding = 8    # 分面标签左右留白（设计稿 .fchip 的 padding:0 8px）
tag-height        = 20    # 行内标签（「未关联作品」「首选变体」）的高（设计稿 .tag）
tag-padding       = 7     # 行内标签左右留白（设计稿 .tag 的 padding:0 7px）
check-column      = 38    # 表格勾选那一列的宽（设计稿 .wtbl .ck）
table-columns     = [56, 48, 86, 58, 108]  # 表格定宽那五列：平台、变体、容量、年份、元数据（设计稿表头的 style="width:…"）
thumb-list-band   = 3     # 行首封面格顶上那一道平台色的高（设计稿 .lthumb i 的 inset 0 3px）
detail-cover-width = 92   # 侧边详情头上封面那一格的宽（设计稿 .dhead 的 92px）
title-card-band   = 4     # 字卡顶上那一道平台色的高（设计稿 .tcard 的 inset 0 4px）
title-card-mark-offset = [4, 8]  # 字卡水印伸出格子多少（右, 下）（设计稿 .tc-wm 的 right:-4px、.dcover .tc-wm 的 bottom:-8px）
thumbs-per-row    = 3     # 侧边详情媒体一行几格（设计稿 .thumbs 的 repeat(3,1fr)）
check-padding     = 12    # 表格勾选那一列左边留白（设计稿 .wtbl .ck 的 padding:0 0 0 12px）
platforms-visible = 7     # 平台那一簇先摆几个，其余收进「更多（N）」（设计稿 #more-plat 前头没带 data-more 的那几个）
stage-columns     = [26, 64] # 工序那一行头两列的宽：圆点、工序名（设计稿 .stage 的 grid-template-columns:26px 64px 1fr auto）
stage-dot         = 22    # 工序圆点的直径（设计稿 .stage .dot）
stage-dot-stroke  = 1.5   # 工序圆点描边的宽（设计稿 .stage .dot 的 border:1.5px）
row-stripe        = 3     # 行左边那条状态竖条的宽（设计稿 .stage.next 与 .tbl td.st 的 inset 3px）
fold-mark         = 7     # 面板标题栏那枚折叠标三角的宽（设计稿 .iconbtn 里 13px 字号的 ▾，照稿图量约 7px）
format-select-width = 150 # 导出设置那一块前端格式下拉的宽（设计稿 select.input 的 width:150px）
root-name-max     = 120   # 库屏根那张表根名称那一列的宽度上限：超过就截断加「…」、悬停看全名，路径那一列始终留得出地方（拿主意的人 2026-09-14 定，稿上没有这一格）
gauge-height      = 10    # 子库卡上容量条的高（设计稿 .gauge 的 height:10px）
gauge-hatch       = 10    # 容量条「清单之外：未知」那一段斜纹一个来回（设计稿 .gauge .unk：5px 有色、5px 空）
legend-swatch     = 9     # 容量条图例前那一小块颜色的边长（设计稿 .legend i 的 9px）
legend-swatch-radius = 2  # 那一小块颜色的圆角（设计稿 .legend i 的 border-radius:2px）
rule-badge        = 20    # 规则行首序号圆的直径（设计稿 .rule .rn 的 20px）
empty-card-padding = 40   # 子库屏空态那张卡的内边距（设计稿空态卡的 padding:40px）
toast-bottom      = 44    # 提示条离窗口底边多远（设计稿 .toast 的 bottom:44px）
toast-padding     = [9, 10, 9, 14]   # 提示条四边留白（上, 右, 下, 左）（设计稿 .toast 的 padding:9px 10px 9px 14px）
toast-button-line = 0.25  # 提示条上那颗按钮的描边是字色的几成（设计稿 .toast .btn 的 rgba(255,255,255,.25)）
toast-seconds     = 3.6   # 只有一句话的提示条停多久，秒（设计稿 toast() 的 3600 毫秒）
toast-action-seconds = 6.5  # 带一颗按钮的提示条停多久，秒（设计稿 toast() 的 6500 毫秒）
impact-dot        = 8     # 弹层里「会怎样」那几条行首圆点的直径（设计稿 .impact li::before 的 8px）
impact-column     = 18    # 行首圆点那一列多宽（设计稿 .impact li 的 grid-template-columns:18px 1fr）
seg-padding       = 2     # 分段按钮外框留白（设计稿 .seg 的 padding:2px）
seg-button-height = 24    # 分段按钮里每一格的高（设计稿 .seg button 的 height:24px）
seg-button-padding = 11   # 分段按钮里每一格左右留白（设计稿 .seg button 的 padding:0 11px）

# ── 调色比例：两套主题共用。设计稿里写在规则上的字面量（color-mix 的百分比、opacity），不是 CSS 变量 ──
[mix]
title-card-tint   = 0.22  # 字卡底色里调进几成平台色（设计稿 .tcard 的 color-mix(… 22%)）
thumb-list-tint   = 0.24  # 行首平台色块底色里调进几成平台色（设计稿 .lthumb 的 color-mix(… 24%)）
watermark-opacity = 0.3   # 字卡上平台代号水印的不透明度（设计稿 .tc-wm 的 opacity:.3）

# ── 阴影的形状：两套主题共用，颜色是各主题里同名的那一格（pop → pop-color） ──
# check_tokens.py 不核这一节：设计稿里是一整句 box-shadow，不是分开的几格。
#
# pop：弹层与弹出菜单。设计稿 --pop 是 `0 10px 30px -12px <pop-color>, 0 0 0 1px <line-2>`。
# 第二层就是描边，已经由 line-2 管着。第一层 egui 的 Shadow 画不出一样的形状：它的扩散只收
# 非负数，于是扩散取 0、模糊从 30 收窄到 24——阴影照旧主要落在下沿，不在四周糊一圈。
[shadow.pop]
offset = [0, 10]   # （横, 竖）
blur   = 24        # 半影多宽
spread = 0         # 往四周扩多少
