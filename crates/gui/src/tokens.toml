# romcat 界面的颜色与尺寸参数（令牌）
#
# **数据不是代码**：与核心库的 platforms.toml / profiles.toml / priorities.toml 同一条纪律，
# `include_str!` 编进二进制（crates/gui/src/tokens.rs），运行时不读盘。
#
# 这份文件是设计稿与界面共用的**唯一**来源，全仓库只有这一份：
# - 界面：crates/gui/src/look.rs 从这里装亮暗两套 Visuals 与字号、圆角，那儿的测试逐项比对，
#   偏一项门禁就红；
# - 设计稿：.scratch/gui-looks-like-the-design/check_tokens.py 读这一份，核对 prototype.html
#   顶部的 CSS 变量。
# 改颜色只改这里；再跑一遍 check_tokens.py，把设计稿那边对齐。
#
# 读得严：少一项、多一项、颜色写法不对，程序当场报错并说出是哪一项。
# 颜色一律写 #RRGGBB（半透明的写 #RRGGBBAA，未预乘）。键名与 CSS 变量同名（去掉前缀 --）。
# 键名是稳定接口：后面每一屏都按这些名字取值，改名等于改接口。

version = 1

# ── 浅色主题 ──────────────────────────────────────────────
[color.light]
ground      = "#E8ECF1"   # 窗口外的底色（设计稿页面背景，不进 egui）
win         = "#F6F7F9"   # 窗口底色：侧栏、页面头
panel       = "#FFFFFF"   # 面板、卡片、对话框
panel-2     = "#F0F2F6"   # 面板里的次级底色：表头、分组头
sunken      = "#E5E9EF"   # 凹陷区：进度条槽、代码块
ink         = "#161A21"   # 正文
ink-2       = "#465063"   # 次要文字
ink-3       = "#677185"   # 说明文字（在 panel 上对比度 ≥ 4.5）
ink-4       = "#A3AAB7"   # 占位、禁用
line        = "#DCE1E8"   # 1 像素描边、分隔线
line-2      = "#C6CDD9"   # 输入框描边、强一级的分隔
accent      = "#3E4EC6"   # 强调色：主按钮、选中、焦点
accent-hover = "#3240AE"
accent-soft = "#E4E7FA"   # 选中行、选中分面的底色
accent-ink  = "#2D3AA3"   # 强调色上的文字 / 强调色的文字形态
on-accent   = "#FFFFFF"   # 主按钮上的文字
hi          = "#0A785C"   # 高置信 / 成功
hi-soft     = "#DBF0E8"
mid         = "#985F00"   # 中置信 / 提醒
mid-soft    = "#F7EAD3"
lo          = "#B0392F"   # 低置信 / 错误 / 危险操作
lo-soft     = "#F9E1DE"
none        = "#6E7788"   # 没有候选 / 中性
none-soft   = "#E6E9EE"
scrim       = "#0C0F158C" # 对话框遮罩（rgba(12,15,21,.55)）
pop-color   = "#10141E73" # 弹层、弹出菜单的阴影（设计稿 --pop 里那一色 rgba(16,20,30,.45)）

# ── 深色主题 ──────────────────────────────────────────────
[color.dark]
ground      = "#07090D"
win         = "#101318"
panel       = "#161A21"
panel-2     = "#1B2028"
sunken      = "#0C0F14"
ink         = "#E5E9F0"
ink-2       = "#A8B1BF"
ink-3       = "#858F9E"
ink-4       = "#4D5563"
line        = "#242A34"
line-2      = "#323A47"
accent      = "#8190F6"
accent-hover = "#9AA6F8"
accent-soft = "#1F2547"
accent-ink  = "#A7B1FA"
on-accent   = "#0D1030"
hi          = "#3FBF9C"
hi-soft     = "#112E27"
mid         = "#DBA243"
mid-soft    = "#302415"
lo          = "#EC7C70"
lo-soft     = "#371E1B"
none        = "#7B8595"
none-soft   = "#1F242D"
scrim       = "#00000099" # rgba(0,0,0,.6)
pop-color   = "#10141E73" # 设计稿暗色没有另写 --pop，照亮色那一份

# ── 平台色：两套主题共用；卡片平台标签、字卡底色、平台色块取这里 ──
[color.platform]
FC  = "#C23B30"
SFC = "#6A5ACD"
GB  = "#7D9A1E"
GBC = "#D0632B"
GBA = "#4453C4"
NDS = "#6F7A8C"
PSP = "#3B4252"
PSV = "#2A6BD1"
PS1 = "#565C6B"
MD  = "#2B2F3A"
PS2 = "#2F4DA0"
NGC = "#6B4FB8"
other = "#555555"         # 表里没有的平台

# ── 视频格上的播放标：两套主题共用 ──
# 它压在一帧视频画面上，不压在界面底色上，画面多亮多暗与主题无关。
# 设计稿里没有这两格的 CSS 变量，check_tokens.py 不核它们。
[color.video]
shade = "#00000050"       # 压在首帧上的那层半透明底
mark  = "#FFFFFF"         # 底上的 ▶

# ── 尺寸（逻辑像素，egui 的 points） ──────────────────────
[radius]
small  = 4    # 分面、标签、小按钮
medium = 6    # 按钮、输入框、列表项
large  = 10   # 面板、卡片、对话框

[font]
sans = ["PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans SC"]   # egui 打包 Noto Sans SC
mono = ["SF Mono", "JetBrains Mono", "Cascadia Mono", "Menlo", "Consolas"]           # egui 打包一份只含拉丁字符的等宽字体
# 字体预算（裁定 2026-09-13）：只打包一份**拉丁与数字**的粗体，中文一律常规字重。
# 于是「粗体」只对拉丁字母和数字生效，中文的层次靠字号、颜色和间距拉开；
# egui 侧不要开字重合成（font_synthesis 关掉），否则会画出假粗体。
bold-coverage = "latin-digits-only"
weight-regular = 400
weight-strong  = 600
size-caption = 11     # 角标、分组标题
size-caption-plus = 11.5   # 表头、图例（稿 11.5）
size-small   = 12     # 说明文字、表格副行
size-small-plus = 12.5   # 屏头说明、表格行（稿 12.5）
size-body    = 13     # 正文、按钮
size-title   = 15     # 卡片标题、对话框标题
size-page    = 18     # 页面标题
size-hero    = 24     # 作品详情页的大标题
line-height  = 1.55
size-badge-narrow = 10    # 左栏收成窄条后入口底下那个计数（设计稿 .main.rcol .nav .badge 的 10px）
group-tracking    = 0.08  # 左栏分组标题的字距，字号的倍数（设计稿 .grp 的 letter-spacing:.08em）
size-button-large = 14    # 大号按钮上的字（设计稿 .btn.lg 的 font-size:14px）

[space]
steps = [4, 8, 12, 16, 20]   # 通用间距的档位；设计稿上写死的字面值不凑进档位，另立下面那些具名令牌
panel-padding  = [11, 14]    # 面板标题栏内边距（上下, 左右）
dialog-padding = [20, 22]    # 对话框内容区内边距（上下, 左右）
cell-padding   = [8, 10]     # 表格单元格内边距
opening-hero-padding = [56, 48]   # 开场左栏内边距（上下, 左右）
opening-side-padding = [40, 36]   # 开场右栏内边距（上下, 左右）
catalog-row-padding  = [12, 14]   # 开场主库列表每一行的内边距（上下, 左右）（设计稿 .catrow 的 padding:12px 14px）
catalog-row-gap      = 2          # 那一行里名字与底下那句之间的竖向间距（设计稿 .catrow 的 gap:2px）
screen-header-padding = [14, 20]  # 屏头的内边距（上下, 左右）（设计稿 .scrhead 的 padding:14px 20px）
screen-header-gap     = 12        # 屏头里标题、副标题、右侧那一段彼此隔多远（设计稿 .scrhead 的 gap:12px）
screen-body-padding   = [18, 20, 28]  # 屏体的内边距（上, 左右, 下）（设计稿 .scrbody 的 padding:18px 20px 28px）
rail-padding           = [10, 8]      # 左栏的内边距（上下, 左右）（设计稿 .rail 的 padding:10px 8px）
rail-padding-collapsed = [10, 6]      # 左栏收成窄条后的内边距（设计稿 .main.rcol .rail 的 padding:10px 6px）
rail-gap               = 2            # 左栏里一项与下一项隔多远（设计稿 .rail 的 gap:2px）
rail-switch-padding    = [8, 9]       # 左栏顶上切换主库那张卡的内边距（上下, 左右）（设计稿 .libsw 的 padding:8px 9px）
rail-switch-gap        = 9            # 那张卡里标志与字之间（设计稿 .libsw 的 gap:9px）
rail-switch-margin     = 6            # 那张卡底下再空多少（设计稿 .libsw 的 margin-bottom:6px）
rail-group-padding     = [12, 10, 4]  # 左栏分组标题的内边距（上, 左右, 下）（设计稿 .grp 的 padding:12px 10px 4px）
rail-group-margin-collapsed = [8, 6]  # 收成窄条后分组标题变成一道线，线四周空多少（上下, 左右）（设计稿 .main.rcol .grp 的 margin:8px 6px）
nav-padding            = 10           # 左栏入口左右留白（设计稿 .nav 的 padding:0 10px）
nav-padding-collapsed  = 7            # 收成窄条后入口上下留白（设计稿 .main.rcol .nav 的 padding:7px 0）
nav-gap-collapsed      = 1            # 收成窄条后入口的字与计数之间（设计稿 .main.rcol .nav 的 gap:1px）
live-badge-gap         = 5            # 任务跑着时入口计数前那枚圆点与数之间（设计稿 .nav .badge.live 的 gap:5px）
rail-foot-gap          = 6            # 左栏栏底几样之间（设计稿 .railfoot 的 gap:6px）
rail-foot-padding      = 10           # 栏底那道线底下空多少（设计稿 .railfoot 的 padding-top:10px）
rail-note-padding      = 10           # 栏底「已保存 N 条裁决」那一行左右留白（设计稿 .railfoot .st 的 padding:0 10px）
rail-note-gap          = 6            # 那一行圆点与字之间（设计稿 .railfoot .st 的 gap:6px）

[layout]
rail-width        = 196   # 左侧导航展开宽度
rail-collapsed    = 68    # 左侧导航收起后的宽度
rail-collapse-below = 800 # 窗口宽不到这么多时左栏自动收成窄条（拿主意的人 2026-09-14 定；设计稿里没有，check_tokens.py 不核）。
                          # 这么算出来的：左栏展开 196 时，浏览屏筛选栏最多吃窗口宽的 35%、详情栏最少 200、正中至少留 120
                          # （crates/gui/src/layout.rs 的 FILTER / DETAIL / FLOOR），于是要 0.65·宽 − 196 ≥ 320，即宽 ≥ 794，取整到 800。
                          # 那三个数一改，这个数跟着重算；layout.rs 的测试钉着「门槛上摆得开、窄 10 点摆不开」。
rail-mark         = 26    # 左栏顶上切换主库那张卡上标志的边长（设计稿 .libsw .mark 的 26px）
nav-height        = 32    # 左栏入口的高（设计稿 .nav 的 height:32px）
rail-dot          = 7     # 左栏里那两枚圆点的直径：任务跑着时、栏底裁决数前（设计稿 .nav .badge.live::before 与 .railfoot .st::before 的 7px）
strip-width       = 36    # 面板折叠后的窄条
filter-pane-width = 232   # 浏览页筛选栏
detail-pane-width = 296   # 浏览页侧边详情
table-row         = 46    # 作品表格行高（等高行）
table-row-cover   = 58    # 打开「在每行开头显示封面」后的行高
tier-bar          = 3     # 置信度色条宽度
thumb-list        = [32, 43] # 列表行首封面缩略图（宽, 高）
card-cover-ratio  = 0.75  # 卡片封面宽高比 3:4
statusbar         = 30    # 底部状态栏高度
dialog-width      = [520, 620, 720, 840]   # 对话框只用这几档宽度
opening-side-width = [440, 560]  # 开场右栏宽度（最窄, 最宽）
opening-hero-min  = 360   # 开场左栏最窄宽度
mark              = 44    # 开场左上角那枚标志的边长
promise-icon      = 28    # 开场三条承诺前那枚字块的边长
page-dot          = 20    # 弹层标头「走到第几问」那一圈的直径
chip-dot          = 6     # 标签左边那枚圆点的直径（设计稿 .chip::before 与 .ro::before 的 6px）
chip-height       = 20    # 标签的高（设计稿 .chip 的 height:20px）
chip-padding      = 7     # 标签左右留白（设计稿 .chip 的 padding:0 7px）
chip-gap          = 5     # 标签里圆点与字之间（设计稿 .chip 的 gap:5px）
ro-height         = 22    # 只读标签的高（设计稿 .ro 的 height:22px；圆点直径与标签共用 chip-dot，字取 size-small）
ro-padding        = 9     # 只读标签左右留白（设计稿 .ro 的 padding:0 9px）
ro-gap            = 6     # 只读标签里圆点与字之间（设计稿 .ro 的 gap:6px）
kv-key-width      = 84    # 「名 → 值」两列排时名那一列的宽
button-height     = 28    # 按钮的高（设计稿 .btn）：弹层页脚、「选择…」
button-padding    = 12    # 按钮左右留白（设计稿 .btn 的 padding:0 12px）
button-small-height  = 24 # 小号按钮的高（设计稿 .btn.sm）：行内「打开」、抬头上的「添加主库」「更改…」
button-small-padding = 9  # 小号按钮左右留白（设计稿 .btn.sm 的 padding:0 9px）
button-large-height = 36  # 大号按钮的高（设计稿 .btn.lg）：开场空态那一颗「添加主库」
button-large-padding = 18 # 大号按钮左右留白（设计稿 .btn.lg 的 padding:0 18px）
control-stroke    = 1     # 控件（按钮、输入框、勾选框）描边的宽：四档一样宽，颜色取各档自己那一格（设计稿 .btn / .input 的 1px）
input-height      = 28    # 单行输入框的高：与同一行默认那一档按钮等高（拿主意的人 2026-09-14 第三次裁；设计稿 .input 是 30，不照它）
input-small-height = 24   # 小号单行输入框的高：与小号按钮等高（开场贴路径那一框，旁边是小号的「换过去」）
input-padding     = 10    # 单行输入框左右留白（设计稿 .input 的 padding:0 10px）

# ── 阴影的形状：两套主题共用，颜色是各主题里同名的那一格（pop → pop-color） ──
# check_tokens.py 不核这一节：设计稿里是一整句 box-shadow，不是分开的几格。
#
# pop：弹层与弹出菜单。设计稿 --pop 是 `0 10px 30px -12px <pop-color>, 0 0 0 1px <line-2>`。
# 第二层就是描边，已经由 line-2 管着。第一层 egui 的 Shadow 画不出一样的形状：它的扩散只收
# 非负数，于是扩散取 0、模糊从 30 收窄到 24——阴影照旧主要落在下沿，不在四周糊一圈。
[shadow.pop]
offset = [0, 10]   # （横, 竖）
blur   = 24        # 半影多宽
spread = 0         # 往四周扩多少
