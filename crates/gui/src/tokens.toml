kbd-bottom        = 2     # 键帽底边那一道的宽（设计稿 .kbd 的 border-bottom-width:2px）
match-key-width   = 64    # 中文离线源那一堆里字段名那一列的宽（设计稿 .mgroup dl 的 grid-template-columns:64px 1fr）
warn-box-padding  = [10, 12]  # 警示框内边距（上下, 左右）（设计稿 .warnbox 的 padding:10px 12px）
platform-table-columns = [64, 110, 130]  # 能力档案平台表「平台 / 不能用时 / 覆盖」三列的宽，「设备直接能用」占余下的（设计稿 DLG.subform 的 th 宽）
capacity-input-width = 110  # 目标设置里「自定义」容量上限那一格的宽（设计稿 DLG.subform 的 width:110px）
exception-table-columns = [56, 84, 92, 64]  # 手动例外表「平台 / 体积 / 时间 / 撤销」四列的宽，「作品」与「备注」分余下的（设计稿 DLG.excl 的 th 宽）
merge-row-columns = [150, 84, 70, 64]  # 合并向导第二步一行里「来自哪儿 / 置信度 / 体积 / 首选」四列的宽，变体那一列占余下的（设计稿 .vrow 的 grid-template-columns:22px minmax(0,1fr) 150px 84px 70px 64px）
conflict-key-width = 90   # 合并向导第三步字段冲突表「字段」那一列的宽，「保留作品」与「其他作品」分余下的（设计稿 .ctbl th 的 width:90px）
exception-note-width = 220  # 手动例外弹层里「备注（可选）」那一格的宽（设计稿 DLG.excl 的 width:220px）
radio-diameter    = 13    # 单选圆点的直径（设计稿 .opt input 是浏览器默认的 13px）
radio-dot         = 5     # 选中时正中那一粒强调色的直径（设计稿 accent-color 画出来的样子）
radio-gap         = 1.5   # 选中时圆心与外圈之间那一道底色缝的宽
option-gap        = 8     # 单选那一行圆点与名字之间（设计稿 .opt 的 gap:8px）
option-padding    = 4     # 单选那一行上下留白（设计稿 .opt 的 padding:4px 0）
tab-height        = 40    # 作品详情页六个面那一排一格的高（设计稿 .tabs button 的 height:40px）
tab-underline     = 2     # 选中那一面底下那道强调色线的粗（设计稿 .tabs button[aria-selected] 的 inset 0 -2px）
meta-row-columns  = [104, 128]  # 作品详情页元数据那一面一行里名那一列、动作那一列的宽（设计稿 .mrow 的 grid-template-columns:104px 1fr 128px）
source-badge-height = 18        # 来源标签的高（设计稿 .srcb 的 height:18px）
pick-chip-height  = 24    # 编辑态下那一排里一个的高（设计稿 .pickchip 的 height:24px）
pick-chip-max     = 280   # 那一个里值最宽摆多少，再长截尾巴（设计稿 .pickchip b 的 max-width:280px）
meta-textarea-rows = 5    # 编辑态下简介那一框几行高（设计稿 metaTab 里 textarea 的 rows="5"）
title-add-columns = [110, 130] # 添加一个名称那一排两个下拉的宽：语言、类型（设计稿 .tadd 的 grid-template-columns:minmax(0,1fr) 110px 130px auto）
media-tile-min    = 200   # 作品详情页媒体那一面一格最窄（设计稿 .mgrid 的 minmax(200px,1fr)）
noff-stripe       = 10    # 没有 ffmpeg 那一块斜纹一道多宽（设计稿 .noff 的 repeating-linear-gradient 那 10px 一段）
hero-cover-width  = 172   # 作品详情页头上封面那一格的宽（设计稿 .hero 的 grid-template-columns:172px）
hero-facts-max    = 980   # 头上那几格事实整排最宽（设计稿 .hfacts 的 max-width:980px）
hero-facts-columns = 6    # 头上那几格事实一排几格（设计稿 .hfacts 的 repeat(6,…)）
hero-card-mark-offset = [4, 16]  # 头上那张字卡的水印伸出格子多少（右, 下）（设计稿 .tc-wm 的 right:-4px、bottom:-16px）
hero-card-title-rows = 4  # 头上那张字卡的标题至多几行（设计稿 .tc-t 的 -webkit-line-clamp:4）
media-strip-columns = 3   # 概览里媒体那一块摆几格（设计稿 .mstrip 的 repeat(3,1fr) 与 slice(0,3)）
overview-columns  = [1.55, 1.0]  # 概览左右两栏的比例（设计稿 .ov 的 minmax(0,1.55fr) minmax(0,1fr)）
work-card-columns = [0.9, 1.1]   # 变体卡身子左右两半的比例（设计稿 .vbody 的 minmax(0,.9fr) minmax(0,1.1fr)）
meta-clamp-rows   = 3     # 元数据那一面简介至多几行（设计稿 .mrow .v.clamp 的 -webkit-line-clamp:3）
card-title-rows   = 3     # 侧边详情头上那张字卡的标题至多几行（设计稿 .dcover .tc-t 的 -webkit-line-clamp:3）
card-subtitle-rows = 2    # 字卡副行至多几行（设计稿 .tc-s 的 -webkit-line-clamp:2）
title-name-share  = 0.30  # 标题面那张表「名称」一列占表宽几成，其余几列均摊、「隐藏」贴右（协调人 2026-09-15 照稿定）

# ── 调色比例：两套主题共用。设计稿里写在规则上的字面量（color-mix 的百分比、opacity），不是 CSS 变量 ──
[mix]
title-card-tint   = 0.22  # 字卡底色里调进几成平台色（设计稿 .tcard 的 color-mix(… 22%)）
thumb-list-tint   = 0.24  # 行首平台色块底色里调进几成平台色（设计稿 .lthumb 的 color-mix(… 24%)）
watermark-opacity = 0.3   # 字卡上平台代号水印的不透明度（设计稿 .tc-wm 的 opacity:.3）
disabled-opacity  = 0.45  # 按不动的控件淡到几成（设计稿 .btn[disabled] 的 opacity:.45）
dirty-row-tint    = 0.07  # 编辑态下改过的那一行底色里调进几成强调色（设计稿 .mrow.dirty 的 color-mix(… 7%)）
hero-tint         = 0.09  # 作品详情页头上那一块底色里调进几成平台色（设计稿 .hero 的 color-mix(… 9%)）
dist-bar-opacity  = 0.7   # 「细分」底下占比条上填的那一截淡到几成（设计稿 .dist .b i 的 opacity:.7）
drill-tint        = 0.05  # 下钻之后就地那一框底色里调进几成强调色（设计稿 .drill 的 color-mix(… 5%)）

# ── 阴影的形状：两套主题共用，颜色是各主题里同名的那一格（pop → pop-color） ──
# check_tokens.py 不核这一节：设计稿里是一整句 box-shadow，不是分开的几格。
#
# pop：弹层与弹出菜单。设计稿 --pop 是 `0 10px 30px -12px <pop-color>, 0 0 0 1px <line-2>`。
# 第二层就是描边，已经由 line-2 管着。第一层 egui 的 Shadow 画不出一样的形状：它的扩散只收
# 非负数，于是扩散取 0、模糊从 30 收窄到 24——阴影照旧主要落在下沿，不在四周糊一圈。
[shadow.pop]
offset = [0, 10]   # （横, 竖）
blur   = 24        # 半影多宽
spread = 0         # 往四周扩多少
