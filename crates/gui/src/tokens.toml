# romcat 界面的颜色与尺寸参数（令牌）
#
# **数据不是代码**：与核心库的 platforms.toml / profiles.toml / priorities.toml 同一条纪律，
# `include_str!` 编进二进制（crates/gui/src/tokens.rs），运行时不读盘。
#
# 这份文件是设计稿与界面共用的**唯一**来源，全仓库只有这一份：
# - 界面：crates/gui/src/look.rs 从这里装亮暗两套 Visuals 与字号、圆角，那儿的测试逐项比对，
#   偏一项门禁就红；
# - 设计稿：.scratch/gui-looks-like-the-design/check_tokens.py 读这一份，核对 prototype.html
#   顶部的 CSS 变量。
# 改颜色只改这里；再跑一遍 check_tokens.py，把设计稿那边对齐。
#
# 读得严：少一项、多一项、颜色写法不对，程序当场报错并说出是哪一项。
# 颜色一律写 #RRGGBB（半透明的写 #RRGGBBAA，未预乘）。键名与 CSS 变量同名（去掉前缀 --）。
# 键名是稳定接口：后面每一屏都按这些名字取值，改名等于改接口。

version = 1

# ── 浅色主题 ──────────────────────────────────────────────
[color.light]
ground      = "#E8ECF1"   # 窗口外的底色（设计稿页面背景，不进 egui）
win         = "#F6F7F9"   # 窗口底色：侧栏、页面头
panel       = "#FFFFFF"   # 面板、卡片、对话框
panel-2     = "#F0F2F6"   # 面板里的次级底色：表头、分组头
sunken      = "#E5E9EF"   # 凹陷区：进度条槽、代码块
ink         = "#161A21"   # 正文
ink-2       = "#465063"   # 次要文字
ink-3       = "#677185"   # 说明文字（在 panel 上对比度 ≥ 4.5）
ink-4       = "#A3AAB7"   # 占位、禁用
line        = "#DCE1E8"   # 1 像素描边、分隔线
line-2      = "#C6CDD9"   # 输入框描边、强一级的分隔
accent      = "#3E4EC6"   # 强调色：主按钮、选中、焦点
accent-hover = "#3240AE"
accent-soft = "#E4E7FA"   # 选中行、选中分面的底色
accent-ink  = "#2D3AA3"   # 强调色上的文字 / 强调色的文字形态
on-accent   = "#FFFFFF"   # 主按钮上的文字
hi          = "#0A785C"   # 高置信 / 成功
hi-soft     = "#DBF0E8"
mid         = "#985F00"   # 中置信 / 提醒
mid-soft    = "#F7EAD3"
lo          = "#B0392F"   # 低置信 / 错误 / 危险操作
lo-soft     = "#F9E1DE"
none        = "#6E7788"   # 没有候选 / 中性
none-soft   = "#E6E9EE"
scrim       = "#0C0F158C" # 对话框遮罩（rgba(12,15,21,.55)）
pop-color   = "#10141E73" # 弹层、弹出菜单的阴影（设计稿 --pop 里那一色 rgba(16,20,30,.45)）

# ── 深色主题 ──────────────────────────────────────────────
[color.dark]
ground      = "#07090D"
win         = "#101318"
panel       = "#161A21"
panel-2     = "#1B2028"
sunken      = "#0C0F14"
ink         = "#E5E9F0"
ink-2       = "#A8B1BF"
ink-3       = "#858F9E"
ink-4       = "#4D5563"
line        = "#242A34"
line-2      = "#323A47"
accent      = "#8190F6"
accent-hover = "#9AA6F8"
accent-soft = "#1F2547"
accent-ink  = "#A7B1FA"
on-accent   = "#0D1030"
hi          = "#3FBF9C"
hi-soft     = "#112E27"
mid         = "#DBA243"
mid-soft    = "#302415"
lo          = "#EC7C70"
lo-soft     = "#371E1B"
none        = "#7B8595"
none-soft   = "#1F242D"
scrim       = "#00000099" # rgba(0,0,0,.6)
pop-color   = "#10141E73" # 设计稿暗色没有另写 --pop，照亮色那一份

# ── 平台色：两套主题共用；卡片平台标签、字卡底色、平台色块取这里 ──
[color.platform]
FC  = "#C23B30"
SFC = "#6A5ACD"
GB  = "#7D9A1E"
GBC = "#D0632B"
GBA = "#4453C4"
NDS = "#6F7A8C"
PSP = "#3B4252"
PSV = "#2A6BD1"
PS1 = "#565C6B"
MD  = "#2B2F3A"
PS2 = "#2F4DA0"
NGC = "#6B4FB8"
other = "#555555"         # 表里没有的平台

# ── 视频格上的播放标：两套主题共用 ──
# 它压在一帧视频画面上，不压在界面底色上，画面多亮多暗与主题无关。
# 设计稿里没有这两格的 CSS 变量，check_tokens.py 不核它们。
[color.video]
shade = "#00000050"       # 压在首帧上的那层半透明底
mark  = "#FFFFFF"         # 底上的 ▶

# ── 尺寸（逻辑像素，egui 的 points） ──────────────────────
[radius]
small  = 4    # 分面、标签、小按钮
medium = 6    # 按钮、输入框、列表项
large  = 10   # 面板、卡片、对话框

[font]
sans = ["PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans SC"]   # egui 打包 Noto Sans SC
mono = ["SF Mono", "JetBrains Mono", "Cascadia Mono", "Menlo", "Consolas"]           # egui 打包一份只含拉丁字符的等宽字体
# 字体预算（裁定 2026-09-13）：只打包一份**拉丁与数字**的粗体，中文一律常规字重。
# 于是「粗体」只对拉丁字母和数字生效，中文的层次靠字号、颜色和间距拉开；
# egui 侧不要开字重合成（font_synthesis 关掉），否则会画出假粗体。
bold-coverage = "latin-digits-only"
weight-regular = 400
weight-strong  = 600
size-caption = 11     # 角标、分组标题
size-caption-plus = 11.5   # 表头、图例（稿 11.5）
size-small   = 12     # 说明文字、表格副行
size-small-plus = 12.5   # 屏头说明、表格行（稿 12.5）
size-body    = 13     # 正文、按钮
size-title   = 15     # 卡片标题、对话框标题
size-page    = 18     # 页面标题
size-hero    = 26     # 作品详情页的大标题，开场左栏的大标题也用这一档（设计稿 .htitle 与 .mast h1 都是 26px；拿主意的人 2026-09-15 定照稿）
size-mini    = 10.5   # 分面标签里的条数（设计稿 .fchip small）
size-path    = 11     # 等宽的路径（设计稿 .w2 / .var .p）
size-detail-title = 17  # 侧边详情头上的标题（设计稿 .dpane h3）
size-thumb-code   = 9   # 行首封面格里的平台代号（设计稿 .lthumb i）
size-cover-title  = 12  # 侧边详情字卡上的标题（设计稿 .dcover .tc-t）
size-cover-mark   = 40  # 侧边详情字卡上的平台代号水印（设计稿 .dcover .tc-wm）
size-arrow        = 10  # 表头上排序那枚小箭头（设计稿 .wtbl th .sa）
size-panel-title = 14 # 面板标题（设计稿 .phead h3）
size-health-value = 16 # 库体检那几格里的数（设计稿 .htile b 的 font-size:16px，等宽）
size-empty-title = 16 # 子库屏空态那张卡的标题（设计稿空态卡 h3 的 font-size:16px）
line-height  = 1.55
size-badge-narrow = 10    # 左栏收成窄条后入口底下那个计数（设计稿 .main.rcol .nav .badge 的 10px）
group-tracking    = 0.08  # 左栏分组标题的字距，字号的倍数（设计稿 .grp 的 letter-spacing:.08em）
size-button-large = 14    # 大号按钮上的字（设计稿 .btn.lg 的 font-size:14px）
size-summary-count = 20   # 待确认屏正文头上三格里的数（设计稿 .qcell .v 的 font-size:20px）
size-batch-count  = 17    # 一批变体卡头上那个条数（设计稿 .bhead .cnt 的 font-size:17px）
size-candidate-title = 13.5  # 候选卡片上作品那一行（设计稿 .cand .t 的 font-size:13.5px）
meta-value-line-height = 1.75  # 作品详情页元数据那一面值那几行的行高，字号的倍数（设计稿 .mrow .v 的 line-height:1.75）
size-section-title = 14.5     # 作品详情页段落卡的标题（设计稿 .sect h3 的 14.5px）
size-noff-mark    = 22    # 没有 ffmpeg 那一块里那个 ▶（设计稿 .noff i 的 font-size:22px）
size-play-mark    = 26    # 媒体那一格视频上压的 ▶（设计稿 .mtile .pv .play 的 font-size:26px）
size-hero-card-title = 17 # 作品详情页头上那张字卡的标题（设计稿 .tc-t 的 17px）
size-hero-card-mark = 72  # 那张字卡的平台代号水印（设计稿 .tc-wm 的 72px）
size-desc         = 13.5  # 概览里简介那一段（设计稿 .desc 的 13.5px）
desc-line-height  = 1.85  # 那一段的行高，字号的倍数（设计稿 .desc 的 line-height:1.85）

[space]
steps = [4, 8, 12, 16, 20]   # 通用间距的档位；设计稿上写死的字面值不凑进档位，另立下面那些具名令牌
panel-padding  = [11, 14]    # 面板标题栏内边距（上下, 左右）
dialog-padding = [20, 22]    # 对话框内容区内边距（上下, 左右）
cell-padding   = [8, 10]     # 表格单元格内边距
opening-hero-padding = [56, 48]   # 开场左栏内边距（上下, 左右）
opening-side-padding = [40, 36]   # 开场右栏内边距（上下, 左右）
catalog-row-padding  = [12, 14]   # 开场主库列表每一行的内边距（上下, 左右）（设计稿 .catrow 的 padding:12px 14px）
catalog-row-gap      = 2          # 那一行里名字与底下那句之间的竖向间距（设计稿 .catrow 的 gap:2px）
filter-pane-padding  = 12         # 浏览屏左栏内边距（设计稿 .fpane 的 padding:12px）
detail-pane-padding  = 16         # 浏览屏右栏内边距（设计稿 .dpane 的 padding:16px）
pane-gap             = 14         # 左右两栏里一段与一段之间（设计稿 .fpane / .dpane 的 gap:14px）
facet-gap            = 5          # 一簇分面标签之间（设计稿 .facet 的 gap:5px）
facet-chip-gap       = 6          # 分面标签里名字与条数之间（设计稿 .fchip 的 gap:6px）
note-padding         = [9, 12]    # 提示框内边距（上下, 左右）（设计稿 .note）
variant-card-padding = [9, 10]    # 侧边详情变体卡片内边距（上下, 左右）（设计稿 .var）
list-bar-padding     = [8, 14]    # 表格上方「列表」那一条的内边距（上下, 左右）（设计稿 .cbar）
table-head-padding   = [7, 10]    # 表头一格的内边距（上下, 左右）（设计稿 .tbl th 的 padding:7px 10px）：浏览屏表头、任务屏历史表头
empty-padding        = 28         # 空态那一块的留白（设计稿 .empty 的 padding:28px）：浏览屏筛空、任务屏空台
health-empty-padding = 18         # 库屏库体检那一块还没扫描时那一句的留白（设计稿 renderHealth 空态行内写的 padding:18px）
health-grid-padding  = [12, 14]   # 库体检那几格外面那一圈（上下, 左右）（设计稿 .health 的 padding:12px 14px）
health-grid-gap      = 10         # 库体检格与格之间（设计稿 .health 的 gap:10px）
health-tile-padding  = [10, 12]   # 库体检一格的内边距（上下, 左右）（设计稿 .htile 的 padding:10px 12px）
health-tile-gap      = 2          # 一格里标题、数、小字之间（设计稿 .htile 的 gap:2px）
health-list-padding  = [9, 12]    # 体检明细一行的内边距（上下, 左右）（设计稿 .lst>div 的 padding:9px 12px）
thumb-gap            = 7          # 侧边详情媒体格之间（设计稿 .thumbs 的 gap:7px）
detail-head-gap      = 12         # 侧边详情头上封面与字之间（设计稿 .dhead 的 gap:12px）
title-card-padding   = [9, 8]     # 侧边详情字卡内边距（上下, 左右）（设计稿 .dcover .tcard）
rule-box-padding     = 10         # 条件组那个框的内边距（设计稿 .gtree 的 padding:10px）
rule-text-padding    = [6, 8]     # 规则原文那一条的内边距（上下, 左右）（设计稿 .ruletext）
section-gap          = 6          # 一段里小标题与底下内容之间（设计稿 .fpane / .dpane 里 .col 的 gap:6px）
variant-card-gap     = [3, 8]     # 变体卡片里上下两行之间、左右两块之间（设计稿 .var 的 gap:3px 8px）
strip-padding        = 10         # 收起那一栏的窄条上下留白（设计稿 .strip 的 padding:10px 0）
strip-gap            = 12         # 窄条上那颗箭头与竖排栏名之间（设计稿 .strip 的 gap:12px）
table-cell-padding   = 10         # 表格一格左右留白（设计稿 .wtbl td 的 padding:0 10px）
cell-gap             = 10         # 表格「作品」那一格里行首封面与字之间（设计稿 .wcell 的 gap:10px）
list-bar-gap         = 10         # 「列表」那一条里几样东西之间（设计稿 .cbar 的 gap:10px）
sort-arrow-gap       = 3          # 表头上的字与排序箭头之间（设计稿 .wtbl th .sa 的 margin-left:3px）
panel-head-gap       = 10         # 面板标题栏里标题、说明、按钮之间的横向间距（设计稿 .phead 的 gap:10px）
library-gap          = 18         # 库屏两栏之间、右栏几块之间的间距（设计稿 .libgrid 的 gap:18px）
screen-header-padding = [14, 20]  # 屏头的内边距（上下, 左右）（设计稿 .scrhead 的 padding:14px 20px）
screen-header-gap     = 12        # 屏头里标题、副标题、右侧那一段彼此隔多远（设计稿 .scrhead 的 gap:12px）
screen-body-padding   = [18, 20, 28]  # 屏体的内边距（上, 左右, 下）（设计稿 .scrbody 的 padding:18px 20px 28px）
rail-padding           = [10, 8]      # 左栏的内边距（上下, 左右）（设计稿 .rail 的 padding:10px 8px）
rail-padding-collapsed = [10, 6]      # 左栏收成窄条后的内边距（设计稿 .main.rcol .rail 的 padding:10px 6px）
rail-gap               = 2            # 左栏里一项与下一项隔多远（设计稿 .rail 的 gap:2px）
rail-switch-padding    = [8, 9]       # 左栏顶上切换主库那张卡的内边距（上下, 左右）（设计稿 .libsw 的 padding:8px 9px）
rail-switch-gap        = 9            # 那张卡里标志与字之间（设计稿 .libsw 的 gap:9px）
rail-switch-margin     = 6            # 那张卡底下再空多少（设计稿 .libsw 的 margin-bottom:6px）
rail-group-padding     = [12, 10, 4]  # 左栏分组标题的内边距（上, 左右, 下）（设计稿 .grp 的 padding:12px 10px 4px）
rail-group-margin-collapsed = [8, 6]  # 收成窄条后分组标题变成一道线，线四周空多少（上下, 左右）（设计稿 .main.rcol .grp 的 margin:8px 6px）
nav-padding            = 10           # 左栏入口左右留白（设计稿 .nav 的 padding:0 10px）
nav-padding-collapsed  = 7            # 收成窄条后入口上下留白（设计稿 .main.rcol .nav 的 padding:7px 0）
nav-gap-collapsed      = 1            # 收成窄条后入口的字与计数之间（设计稿 .main.rcol .nav 的 gap:1px）
live-badge-gap         = 5            # 任务跑着时入口计数前那枚圆点与数之间（设计稿 .nav .badge.live 的 gap:5px）
rail-foot-gap          = 6            # 左栏栏底几样之间（设计稿 .railfoot 的 gap:6px）
rail-foot-padding      = 10           # 栏底那道线底下空多少（设计稿 .railfoot 的 padding-top:10px）
rail-note-padding      = 10           # 栏底「已保存 N 条裁决」那一行左右留白（设计稿 .railfoot .st 的 padding:0 10px）
rail-note-gap          = 6            # 那一行圆点与字之间（设计稿 .railfoot .st 的 gap:6px）
screen-section-gap   = 18            # 屏体里一块与一块之间（设计稿任务屏 .scrbody.col 的 gap:18px）
section-title-gap    = 8             # 小标题与底下那一块之间（设计稿任务屏 .col 的 gap:8px）
card-padding         = 16            # 正在跑那张卡的内边距（设计稿 .runcard 的 padding:16px）
card-row-gap         = 8             # 那张卡里一排与一排之间（设计稿 .runcard 的 gap:8px 16px 竖向那一半）
queue-row-padding    = [10, 14]      # 等待中那一行卡片的内边距（上下, 左右）（设计稿 renderTasks 那张卡的 padding:10px 14px）
meta-gap             = 18            # 正在跑那张卡底下那一排，格与格之间（设计稿 .runcard .meta 的 gap:18px）
queue-summary-gap    = 12            # 待确认屏正文头上三格之间（设计稿 .qsum 的 gap:12px）
queue-summary-margin = 16            # 三格底下空多少（设计稿 .qsum 的 margin-bottom:16px）
queue-cell-padding   = [12, 14]      # 三格每一格的内边距（上下, 左右）（设计稿 .qcell 的 padding:12px 14px）
record-row-padding   = [12, 16]      # 裁决记录抽屉里一行、页脚那句说明的内边距（上下, 左右）（设计稿 .lot 的 padding:12px 16px）
empty-state-margin   = 40            # 待确认屏空态那张卡上面空多少（设计稿 #q-empty .card 的 margin:40px auto）
empty-state-padding  = 24            # 那张卡的内边距（设计稿 #q-empty .card 的 padding:24px）
empty-state-gaps     = [8, 16, 10]   # 那张卡里标题后、说明后、按钮后各空多少（设计稿 #q-empty 那句说明的 margin:8px 0 16px、底下帮助字的 margin-top:10px）
batch-gap            = 10            # 一批变体卡片与卡片之间（设计稿 .batch 的 margin-bottom:10px）
batch-head-padding   = [12, 16]      # 卡头内边距（上下, 左右）（设计稿 .bhead 的 padding:12px 16px）
batch-head-gap       = 14            # 卡头里条数、形状、标签、折叠标几列之间（设计稿 .bhead 的 gap:14px）
batch-body-padding   = [4, 16, 16]   # 展开之后那一块的内边距（上, 左右, 下）（设计稿 .bbody 的 padding:4px 16px 16px）
batch-body-gap       = 18            # 展开之后那一块里判定依据、两栏、按钮三排之间，两栏之间（设计稿 .bbody 的 gap:18px）
why-padding          = [10, 12]      # 判定依据那一框的内边距（上下, 左右）（设计稿 .why 的 padding:10px 12px）
sample-row-padding   = 6             # 随机样本一行上下留白（设计稿 .smp 的 padding:6px 0）
bare-margin          = 18            # 「没有候选」那个虚线框上面空多少（设计稿 .bare 的 margin-top:18px）
bare-padding         = [12, 16]      # 那个虚线框的内边距（上下, 左右）（设计稿 .bare 的 padding:12px 16px）
bare-note-gap        = 6             # 虚线框里头一行与底下那句说明之间（设计稿 .bare .help 的 margin-top:6px）
shape-gap            = [4, 6]        # 卡头第一行依据形状各段之间（上下, 左右）（设计稿 .shape 的 gap:4px 6px）
batch-line-gap       = 2             # 卡头两行字之间（设计稿 .bhead .why1 的 margin-top:2px）
