[package]
name = "romcat-gui"
description = "romcat 界面：五屏（库 / 浏览 / 待确认 / 子库 / 任务）的窗口壳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# **合成数据与实测那几条开关，默认关掉。**
#
# 交付出去的客户端里不该有一个字节的假数据：假数据与真库在界面上长得一模一样，
# 看见一屏假名字的第一反应会是「我的库怎么了」，而不是「我打开的不是我的库」。
# 关掉之后 `demo` 模块与 `--demo` / `--bench*` 全部不进二进制。
#
# 测试与实测：`cargo test --features demo`；门禁一律用 `--all-features`，
# 否则下面那**七个**测试文件**整份都不编译**（不是逐条跳过——`required-features` 没满足，
# 这七个测试目标压根不生成二进制）。连同别处被 `cfg` 掐掉的，不带 `--all-features`
# 全仓库少跑 115 条：1,575 而不是 1,690。**少跑不报错，退出码照样是 0。**
# （这两个数随票涨，以 `cargo xtask gate` 的输出为准；它们同时还写在 `README.md` 里，
#   改一处得改两处——没有任何东西盯着这两处同步，挂单 `Q198` / `Q268` 记着这条。
#   眼下这一对是在票 `parking-3/08` 的分支上量的，基线 `b816a48`；`main` 已经往前走过，
#   合并时由编排者复核。）
demo = []

[[bin]]
name = "romcat-gui"
path = "src/main.rs"

# 这七个测试要合成数据撑场面，因此声明依赖。门禁不带 `--all-features` 就跑不到它们。
[[test]]
name = "close"
required-features = ["demo"]

[[test]]
name = "browse"
required-features = ["demo"]

[[test]]
name = "media"
required-features = ["demo"]

[[test]]
name = "layout"
required-features = ["demo"]

[[test]]
name = "queue"
required-features = ["demo"]

[[test]]
name = "table"
required-features = ["demo"]

[[test]]
name = "task"
required-features = ["demo"]

[dependencies]
# 三个开关（`--catalog` / `--bench` / `--font-check`）本可以手写解析，用 clap 是为了与
# `romcat-cli` 一套写法，`--help` 也顺带有了。
clap.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
romcat-core.workspace = true

[dev-dependencies]
# **只有测试用它**：媒体那几条要造真的 png 才验得了「画得出来、纵横比不歪」。
# 界面这一层自己一个字节都不解码——那在核心库里（`romcat_core::scrape::preview`）。
image.workspace = true

[lints]
workspace = true
