# 模型的价目表。**数据不是代码**（同 `platform::Manifest` 与 `scrape::Priorities`）。
#
# 它存在的全部理由是**花费要设得上限**（票 12 的验收之一）：不知道一百万个 token
# 值多少钱，`--model-max-spend` 就是一句空话。所以价目表里没有的模型**整层不启动**，
# 而不是「先跑起来，花费那一栏写「说不出」」——后者等于把上限悄悄取消掉。
#
# 单位是**每百万 token 多少美分**（整数）。用美分而不是浮点：一趟几百个请求要把
# 花费一笔一笔加起来，浮点累加的误差正好落在「有没有超上限」这个判断上。
#
# 价格会变，也会有新模型。**改这张表不必动一行 Rust**：
# `romcat identify --model-pricing <文件>` 换成自己的一份，
# `romcat identify --model-dump-pricing` 导出这份底稿照着改
# （与 `--name-rules` / `--manifest` / `--sources` 同一个套路）。

# 这份表是什么时候、照哪儿抄的。报告会把它原样印出来——
# **价目表过时是这一层唯一会「安静地算错钱」的地方**，所以核实日期要看得见
# （与 ADR-0017 说「能力矩阵应标注数据来源与核实日期」同一条道理）。
"核实日期" = "2026-09-02"
"出处" = "Anthropic 官方价目（每百万 token 的美元价），经 claude-api 技能的模型表核对"

