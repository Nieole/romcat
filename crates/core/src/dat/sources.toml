# 数据源清单：DAT 从哪儿取、哪份归哪个平台
#
# **这份文件是数据不是代码**（同 `docs/platforms.md`）。加一个源、改一条映射都不该动
# Rust——工具内置这一份，`--sources <文件>` 可以整份换掉，
# `romcat dat sources --dump-builtin` 导得出底稿。
#
# ════════════════════════════════════════════════════════════════════════
# 两条取数纪律。**改这份文件的人先读这一段。**
# ════════════════════════════════════════════════════════════════════════
#
# 1. **绝不写 `datomatic.no-intro.org`。** 那是 No-Intro 的 DAT 生成站点，调研中一次
#    参数畸形的请求就触发了**永久 IP 封禁**，解封要发邮件求人。它的 robots.txt 声称允许
#    抓取，**不可作为安全依据**（ADR-0007）。No-Intro 的 DAT 一律走下面那个 GitHub
#    每日镜像。
#
# 2. **Redump 绝不写 `redump.org`，也绝不从上面那个镜像取。** 镜像的 `redump.py`
#    硬编码了 `redump.org`，而那自 2026-06-20 起是**冻结镜像**：旧站 60 个系统、
#    现站 106 个，相差 46 个（Wii U 541 条、Symbian 3 条全在旧站上看不见）。更坏的是
#    旧站会以「系统存在但 No discs found」的形式**误导**（ADR-0007 修订段）。
#
# 这两条不指望靠自觉——`dat::guard` 是一道**运行时闸门**，写进去也发不出去。
#
# ════════════════════════════════════════════════════════════════════════
# 哈希口径
# ════════════════════════════════════════════════════════════════════════
#
# `含头` = 按磁盘上原样的整个文件算；`去头` = 先剥掉转储头再算；
# `逐芯片` = MAME 那种一颗芯片一条记录。
#
# **No-Intro 的 headerless 集按去头，TOSEC 与 GoodNES 按含头**（ADR-0002 修订段）。
# 同一份 `'89 Dennou Kyuusei Uranai` 在两边的 SHA-1 完全不同，只算一套就会丢掉
# TOSEC 里全部汉化条目。票 07 要同时算两套，据这一列决定拿哪一套去撞。
#
# 大多数卡带平台（GB/GBA/NDS/N64/MD…）根本没有外挂头，两套口径落在同一串字节上，
# 写 `含头` 即可。真正要区分的只有 NES（iNES 16 字节）、FDS、SFC（copier 512 字节）
# 与 Lynx（LNX 64 字节）这几家。
#
# ════════════════════════════════════════════════════════════════════════
# 映射：从上往下第一条匹配的胜出
# ════════════════════════════════════════════════════════════════════════
#
# 模式记号同成型规则（`platform::pattern`）：`#` 一位数字、`@` 一位字母、`*` 任意长，
# 其余字面量且大小写不敏感。**先写窄的、再写宽的。**
#
# 拿什么去匹配随源而变：No-Intro 是 DAT 自称的名字，Redump 是系统短码，
# 其余是仓库内的路径。
#
# 一条映射要么给「平台」，要么给「跳过」（附理由），正好一个。
# **没有任何映射命中的 DAT 整份不入库**——那是范围边界，不是遗漏。
# 选进来的这一批对着 `docs/library-facts.md` 里实测的 22 个平台，
# 顺带留了几个库里现在没有、以后可能有的。

"版本" = 1

# ════════════════════════════════════════════════════════════════════════
# 数据源
# ════════════════════════════════════════════════════════════════════════

[["数据源"]]
"名" = "No-Intro"
"取法" = "GitHub 发行资产"
"仓库" = "hugo19941994/auto-datfile-generator"
"资产" = "no-intro.zip"
"格式" = "Logiqx"
"口径" = "含头"
"说明" = """
每 24 小时自动重建的 No-Intro 全量包，实测 334 份 DAT、106 MB。走 GitHub Releases 的 \
CDN，无封禁风险、无速率问题。**这是 No-Intro 唯一许可的取法**——直连 datomatic 会被永久封 IP。
增量的粒度是整个包：镜像只发整包，发不了单份 DAT。指纹取发行资产的 updated_at 加大小。
同一个仓库里还有 redump.zip / redump.xml，**那两个不能用**（硬编码了冻结的旧域名），
闸门会挡下来。"""

[["数据源"]]
"名" = "Redump"
"取法" = "Redump 站点"
"站点" = "https://redump.info"
"格式" = "Logiqx"
"口径" = "含头"
"说明" = """
光盘世代的权威库，实测 106 个系统。`/downloads/` 列系统短码，`/datfile/<短码>` 直接返回 \
ZIP，无需注册无需登录。它既不给 ETag 也不给 Last-Modified，但 Content-Disposition 里的 \
附件名带着条目数与生成时刻（`… - Datfile (10974) (2026-08-31 07-59-02).zip`），正好当指纹用：
先 HEAD 问一句，没变就不下正文。robots.txt 全站放行、无 Crawl-delay，但仍按每秒一次自我节流。"""

[["数据源"]]
"名" = "TOSEC"
"取法" = "GitHub 仓库文件"
"仓库" = "smesgr9000/TOSEC-DAT"
"引用" = "main"
"格式" = "Logiqx"
"口径" = "含头"
"说明" = """
TOSEC 官方 release 的 GitHub 镜像，实测 4502 份 DAT。**它是汉化版哈希的主力来源**——
TOSEC 的命名规范把汉化版正式收录为 `[tr zh]`，带完整 CRC32/MD5/SHA1，而 No-Intro 与 \
Redump 在政策上永不收录修改版。本工具实测这份清单映射到的 309 份 DAT 里共 **499 条** \
`[tr zh]`（FC 364、MD 44、GB 42、SFC 25、GBA 13、N64 4、NGPC 3、GBC 2、DC 1、WSC 1）。
⚠ 调研记的「960 条」是每平台恰好两倍：那个计数把 `<game name>` 与 `<description>` 各数了一次。
按条目数，正确的数是这里这一批。
列举必须走 git/trees?recursive=1：`/contents` 在 1000 条处硬截断且不报错，
调研中因此一度误判 TOSEC 缺少多个平台集。指纹取每个 blob 的 sha。"""

[["数据源"]]
"名" = "MAME"
"取法" = "GitHub 仓库文件"
"仓库" = "mamedev/mame"
"引用" = "master"
"子树" = "hash"
"格式" = "MAME software list"
"口径" = "逐芯片"
"说明" = """
家用系统的 software list。价值不在覆盖面而在**许可**：MAME 整体是 GPL-2.0，但 hash/ 目录 \
被单独献给公有领域（每个 XML 自带 `license:CC0-1.0`）——全部数据源里唯一可无条件商用、
无署名义务、无 ShareAlike 传染的哈希源。只看 hash 这棵子树：MAME 有五万多个文件，
递归列举整个仓库又大又慢。**街机的 ROM 哈希不在这里**（硬编码在 C++ 驱动源码里）。"""

[["数据源"]]
"名" = "GoodNES"
"取法" = "GitHub 仓库文件"
"仓库" = "TASEmulators/BizHawk"
"引用" = "master"
"子树" = "Assets/gamedb"
"格式" = "BizHawk gamedb"
"口径" = "含头"
"说明" = """
GoodTools 早已停更、官网也没了，但 BizHawk 把 GoodNES 与 GoodGen 转成纯文本跟着发行版一起发。
本工具实测 gamedb_goodnes.txt 22,095 条里有 **646** 条 `[T+Chi]` / `[T-Chi]` 汉化，\
gamedb_sega_md.txt 8,149 条里有 **102** 条。
⚠ 调研记的 MD「172 条」是把 102 条汉化与 70 条 `(Ch)`（GoodTools 的**中国区**国别码）\
加在了一起。这里只把 `[T±Chi]` 算作汉化——`(Ch)` 说的是发行地区不是谁做的中文。
**没有大小也没有 CRC-32**，而且首列的哈希**逐行而定**：MD 那份 5,774 行 MD5、2,375 行 SHA-1，\
两种都得收，只认 SHA-1 会丢掉 102 条中文里的 35 条。含头口径有实测佐证：
`'89 Dennou Kyuusei Uranai (J) [f1]` 在这里的 SHA-1 与 TOSEC 那份带头 .nes 逐位相同。"""

