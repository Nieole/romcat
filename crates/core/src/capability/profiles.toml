"吃" = ["zip", "vpk", "vci"]
"转成" = "zip"
"来源" = "ADR-0014 修订段（Vita3K 只认 .zip / .vpk / .vci）；`docs/research/zstandard-containers.md`：库里 PSV 那批是 tar 套 zst 的双层结构"
"核实日期" = "2026-08-31"

