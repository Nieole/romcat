# ⭐ SWITCH：ES-DE 出厂的 `es_systems.xml` 里 Switch 的扩展名是
# `.nca .nro .nso .nsp .xci`——**没有 .nsz / .xcz**。库里 55 个这样的文件、74.67 GiB，
# 占 Switch 容量的 33.4%，在 ES-DE 里默认完全看不见。工具这一版转不了它们
# （要 `nsz -D`，而那要用户自备 prod.keys），于是**报出来**。
[["平台矩阵"."条目"]]
"平台" = ["SWITCH"]
"吃" = ["nsp", "xci", "nca", "nro", "nso"]
"来源" = "`docs/research/switch-identification.md` §6.2：ES-DE `resources/systems/{linux,windows}/es_systems.xml` 的 switch 条目扩展名是 `.nca .nro .nso .nsp .xci`，全文件 `grep -ic \"nsz|xcz\"` = 0；Eden `src/core/loader/loader.cpp` 的 `IdentifyFile()` 同样不认 nsz/xcz"
"核实日期" = "2026-08-31"

