# 能力档案：目标设备吃得下什么，目标存储放得下什么
#
# **这份文件是数据不是代码**（与 `platform/platforms.toml` 同一条纪律）。模拟器每更新
# 一版这张表就可能过时，改它不该动 Rust——工具内置这一份，
# `romcat capability --dump-builtin <文件>` 导一份出来照着改，放进工作目录叫
# `capability.toml` 就生效（`romcat capability --file <文件>` 只是拿来看一眼，不影响同步）。
#
# ## 每一条都必须写「来源」与「核实日期」
#
# ADR-0017 的原话：**矩阵错误比不转换更糟**——用户会以为工具已经处理妥当，直到在掌机上
# 打不开才发现。于是每一条声明都得写清它从哪儿来、哪天核实的。`romcat capability <档案名>`
# 把这两样原样印出来，核实日期超过 180 天的标成**陈旧**。
#
# ## 三个字段各管一件事
#
# - `"吃"`：这个平台的前端与核心**直接吃得下**的扩展名（小写、不带点）。
#   写 `["*"]` 表示**不作声称**——那是「没查过」，不是「什么都能吃」，工具于是既不转
#   也不报。**没查过就写 `*`，别猜**。
# - `"转成"`：吃不下的时候往哪儿转。取值只有两个，都是这一版**真的做得到**的：
#   - `"zip"`——把**透明容器**重打包成 zip；
#   - `"裸文件"`——把**透明容器**里那一份原样取出来（只对**只有一个内容条目**的容器）。
#   **压缩镜像**之间的互转（cue+bin→chd、wbfs→rvz、zso→cso）这一版做不了：那要外部工具
#   （chdman / DolphinTool / maxcso）。做不到的一律**如实报出来**，不假装搞定了。
# - `"来源"` / `"核实日期"`：见上。
#
# ## 三个坐标拼出一份档案
#
# 一份**能力档案** = 一张**平台矩阵**（前端与核心吃什么）× 一个**文件系统**（存储放得下
# 什么）。分开写是因为它们真的各变各的：同一个 RetroArch，卡是 exFAT 还是 FAT32 完全是
# 另一件事，而 FAT32 那 4 GiB 的单文件上限恰恰是最容易在传到一半才发现的那种失败。

"版本" = 1

# ════════════════════════════════════════════════════════════════════════
# 扩展名组
# ════════════════════════════════════════════════════════════════════════
#
# 只是给下面的 `"吃"` 列表省字，`@名字` 引用。**组是并集且故意放宽**：卡带类那一组
# 把各机种的裸扩展名并在一起，于是 GB 目录里躺着一个 `.nes` 不会被报成「吃不下」。
# 那种事是**成型与识别**该管的，不是能力档案该管的——能力档案只回答「这个形态在目标
# 设备上启动得了吗」。

[["扩展名组"]]
"名" = "卡带裸文件"
"扩展名" = [
  "nes", "fds", "unf", "unif", "nez",
  "sfc", "smc", "fig", "swc", "bs", "st",
  "gb", "gbc", "sgb", "gba", "srl", "agb",
  "nds", "dsi", "ids",
  "3ds", "cci", "cxi", "cia", "app",
  "n64", "z64", "v64", "ndd",
  "md", "gen", "smd", "32x", "sms", "gg", "sg",
  "pce", "sgx",
  "vb", "vboy",
  "ws", "wsc",
  "ngp", "ngc", "npc",
  "lnx", "lyx",
  "col", "int", "a26", "a78",
  "mx1", "mx2", "dsk", "cas",
  "rom", "bin",
]

# **只列有一手来源撑得住的那些。** `nrg` / `toc` / `raw` 曾经在这一组里，被拿掉了：
# 调研第 3 部分没有任何一条源码或官方文档说哪个模拟器认它们，而**编一条「吃得下」
# 比不转换更糟**——用户会以为工具已经处理妥当，直到在掌机上打不开才发现（ADR-0017）。
# 宁可判成「吃不下」多报几条，也不编一条「原样搬」。
[["扩展名组"]]
"名" = "光盘裸镜像"
"扩展名" = ["iso", "img", "bin", "cue", "ccd", "sub", "mdf", "mds", "ecm", "m3u"]

# ════════════════════════════════════════════════════════════════════════
# 文件系统
# ════════════════════════════════════════════════════════════════════════
#
# **能力档案不能只描述模拟器**（ADR-0017 补充段）。放不进去的东西必须在**差量预览**
# 阶段就报出来，而不是传到一半失败——传到一半的失败会在卡上留下半份文件、在清单里
# 留下一条谎。

[["文件系统"]]
"名" = "无限制"
"说明" = "不作任何声称：本机目录、或者不知道目标是什么文件系统时用它"
"单文件上限" = 0
"文件名字符上限" = 0
"路径字符上限" = 0
"文件名禁用字符" = ''
"保留名" = []
"来源" = "这不是一份文件系统声明，是「不做检查」这个选择本身"
"核实日期" = "2026-09-02"

[["文件系统"]]
"名" = "exFAT"
"说明" = "SD 卡出厂默认，64 GB 以上的卡基本都是它"
# exFAT 的文件长度字段是 64 位，实际上限远够不到；写 0 表示不设限。
"单文件上限" = 0
# 255 个 UTF-16 码元。注意**不是字节**：一个汉字算 1，一个 emoji 算 2。
"文件名字符上限" = 255
# ⭐ **260 是 Windows 的 API 限制，不是文件系统的限制**——它对 exFAT 与 FAT32 一样成立，
# 只写在 FAT32 那一份上是错的。卡在主力机（Windows，ADR-0018）上写，就得按它来。
"路径字符上限" = 260
# 与 FAT32 同一套：这几个字符 Windows 的文件 API 一律不收。
"文件名禁用字符" = '\/:*?"<>|'
"保留名" = [
  "CON", "PRN", "AUX", "NUL",
  "COM1", "COM2", "COM3", "COM4", "COM5", "COM6", "COM7", "COM8", "COM9",
  "LPT1", "LPT2", "LPT3", "LPT4", "LPT5", "LPT6", "LPT7", "LPT8", "LPT9",
]
"来源" = "Microsoft「Naming Files, Paths, and Namespaces」的保留字符、保留设备名与 `MAX_PATH`；ADR-0018（主力机是 Windows，卡在那台机器上写）。**这三条都是 Windows API 的限制而不是 exFAT 自己的**——文件长度那一条才是文件系统的，而 exFAT 的 64 位长度字段实际上够不到"
"核实日期" = "2026-09-02"

[["文件系统"]]
"名" = "FAT32"
"说明" = "老卡、小卡与不少掌机出厂格式。**4 GiB 单文件上限**是这一版最要紧的那条约束"
# ⭐ 4 GiB - 1 字节。PS2 / PSP 的大 ISO 直接放不进去，而这件事必须在差量预览阶段
# 就说出口——ADR-0017 补充段点名的正是它。
"单文件上限" = 4294967295
"文件名字符上限" = 255
# Windows 的 `MAX_PATH`，含盘符与结尾的 NUL。比的是**完整路径**（子库根 + 相对路径），
# 因此同一份内容挂在 `E:\Games` 与挂在一条很深的路径底下，结论会不同——那是实情。
"路径字符上限" = 260
"文件名禁用字符" = '\/:*?"<>|'
"保留名" = [
  "CON", "PRN", "AUX", "NUL",
  "COM1", "COM2", "COM3", "COM4", "COM5", "COM6", "COM7", "COM8", "COM9",
  "LPT1", "LPT2", "LPT3", "LPT4", "LPT5", "LPT6", "LPT7", "LPT8", "LPT9",
]
"来源" = "**4 GiB 那一条是 FAT32 自己的**：ADR-0017 补充段。文件名字符、保留名与 `MAX_PATH` 是 Windows API 的限制（Microsoft「Naming Files, Paths, and Namespaces」），对 exFAT 一样成立"
"核实日期" = "2026-09-02"

# ════════════════════════════════════════════════════════════════════════
# 平台矩阵
# ════════════════════════════════════════════════════════════════════════

# ── 不作声称 ────────────────────────────────────────────────────────────
#
# 一条 `*` 打完。它存在的意义是让「不做转换」成为一个**说得出口的选择**，而不是
# 「还没配」这个默认状态——没配过的子库走的正是它，于是票 20 的行为一个字不变。

[["平台矩阵"]]
"名" = "不作声称"
"说明" = "对任何平台都不作声称：不转换、不检查，与票 20 的行为完全一致"

[["平台矩阵"."条目"]]
"平台" = ["*"]
"吃" = ["*"]
"来源" = "这不是一份能力矩阵，是「不做转换、不做检查」这个选择本身"
"核实日期" = "2026-09-02"

# ── RetroArch ───────────────────────────────────────────────────────────

[["平台矩阵"]]
"名" = "retroarch"
"说明" = "RetroArch 与常见 libretro 核心"

# 卡带类：**透明容器**由 RetroArch 自己解，核心拿到的是内存里的字节
# （`need_fullpath = false`），于是 zip / 7z 原样就能玩。
[["平台矩阵"."条目"]]
"平台" = [
  "FC", "FDS", "SFC", "GB", "GBC", "GBA", "NDS", "3DS", "N64",
  "MD", "SMS", "GG", "32X", "PCE", "VB", "WS", "NGPC", "Lynx", "MSX",
]
"吃" = ["@卡带裸文件", "zip", "7z", "zst", "apk"]
# ⭐ **rar 转 zip 而不是转 7z**：zip 兼容面最广，而且中央目录存 CRC-32，转换后仍然
# 零解压识别得了（ADR-0014）。这一版转得了的只有 zip/7z 之间——`.rar` 本身读不了，
# 于是会被如实报成「吃不下且转不了」。
"转成" = "zip"
"来源" = "调研 3.1.1：RetroArch `libretro-common/file/archive_file.c` 的 `file_archive_get_file_backend()` 分派只有 7z / zip / apk / zst，仓库里根本不存在 `archive_file_rar.c`（实测 HTTP 404）；3.1.2：`need_fullpath = false` 的核心直接在内存里解压"
"核实日期" = "2026-08-31"

# 光盘类：**透明容器一律不吃**。RetroArch 对 `need_fullpath` 的核心会把它解到临时目录，
# 但 `content_file_extract_from_archive()` 只解出**一个**匹配的文件——`cue + bin` 这种
# 多文件光盘一解就散架。宁可判「吃不下、要解包」也不赌那一步。
#
# ⭐ **只留 PS1 与 DC 两行，SS / Mega-CD / 3DO 落到兜底的「不作声称」。** 原本这三个
# 跟 PS1 挤在一行里，而调研第 3 部分对它们**一个字的一手来源都没有**——那等于编。
[["平台矩阵"."条目"]]
"平台" = ["PS1"]
"吃" = ["@光盘裸镜像", "chd", "pbp"]
"转成" = "裸文件"
"来源" = "调研 3.1.2：`content_file_extract_from_archive()` 只抽出一个匹配 `valid_exts` 的文件，多文件光盘的透明容器因此不可靠；3.1.4 与表 2：CHD 与 PBP 的播放由核心（Beetle PSX / SwanStation）提供。**裸镜像那半句是【推断】**：libretro 的 SwanStation 就是 DuckStation 的移植，扩展名照 3.2.2 的 DuckStation 那一行"
"核实日期" = "2026-08-31"

[["平台矩阵"."条目"]]
"平台" = ["DC"]
"吃" = ["chd", "gdi", "cdi", "cue", "bin", "iso"]
"转成" = "裸文件"
"来源" = "调研 3.2.2：libretro 的 Flycast 核心与独立版同源，`core/imgread/common.cpp` 的 `drivers[] = {chd_parse, gdi_parse, cdi_parse, cue_parse, cdio_parse}`；3.1.2：透明容器解到临时目录只抽一个文件，多轨光盘因此不可靠"
"核实日期" = "2026-08-31"

[["平台矩阵"."条目"]]
"平台" = ["PS2"]
"吃" = ["@光盘裸镜像", "chd", "cso", "zso"]
"转成" = "裸文件"
"来源" = "调研 3.2.2：PCSX2 `pcsx2/CDVD/InputIsoFile.cpp` 的 `GetFileReader()` 认 chd / cso / zso / gz / dump，其余走 FlatFileReader；⭐ **PCSX2 支持 zso 而 PPSSPP 不支持**，与直觉相反"
"核实日期" = "2026-08-31"

[["平台矩阵"."条目"]]
"平台" = ["PSP"]
"吃" = ["iso", "cso", "chd", "pbp"]
"转成" = "裸文件"
"来源" = "调研 3.2.2：PPSSPP `Core/FileSystems/BlockDevices.cpp` 的 `constructBlockDevice()` 只认 `CISO` / `\\0PBP` / `MComprHD`，`Core/Loaders.cpp` 只认 .iso/.cso/.chd；⭐ **不支持 ZSO 与 CSO v2**（`hdr.ver > 1` 报 \"CSO version too high!\"，issue #20890 closed as not planned），也不支持 DAX"
"核实日期" = "2026-08-31"

[["平台矩阵"."条目"]]
"平台" = ["NGC", "WII"]
"吃" = ["iso", "gcm", "gcz", "ciso", "wbfs", "wia", "rvz", "nfs", "tgc"]
"转成" = "裸文件"
"来源" = "调研 3.2.2：Dolphin `Source/Core/DiscIO/Blob.cpp` 的 `CreateBlobReader()` 按 magic 分派，`BlobType` 枚举是 PLAIN / DIRECTORY / GCZ / CISO / WBFS / TGC / WIA / RVZ / MOD_DESCRIPTOR / NFS / SPLIT_PLAIN——**没有 CHD**"
"核实日期" = "2026-08-31"

# 街机：MAME / FBNeo 类核心声明 `block_extract = true`，RetroArch **不解压**，
# 把 zip 路径本身交给核心——那不是包装而是它要的输入形态。
[["平台矩阵"."条目"]]
"平台" = ["街机"]
"吃" = ["zip", "7z"]
"转成" = "zip"
"来源" = "调研 3.1.2：`block_extract = true` 的核心（MAME / FBNeo）拿到的是那个容器的路径本身，不解压"
"核实日期" = "2026-08-31"

# 剩下的平台 RetroArch 这边**没查过**。不猜——写 `*` 就是「不作声称」。
[["平台矩阵"."条目"]]
"平台" = ["*"]
"吃" = ["*"]
"来源" = "调研第 3 部分未覆盖 SS / Mega-CD / 3DO / PS3 / PSV / WIIU / SWITCH / XBOX360 在 RetroArch 侧的形态。没查过就不作声称"
"核实日期" = "2026-08-31"

