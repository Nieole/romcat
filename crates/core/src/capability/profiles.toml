# ⭐ PSV：**Vita3K 只认 .zip / .vpk / .vci**。库里那批 PSV 的 `.tar.zst` 一个都装不了。
# 票 26 之后工具**读得了**它的内部构成了，于是「转成 zip」这条配方对**只裹着一份内容**
# 的那种（`TWEWY.vpk.tar.zst`）真的转得动；裹着一整棵目录树的那种（真机实测一份有
# 2,106 条内部条目）仍然转不了，但理由从「读不了」变成了「容器里有 N 个内容条目」
# （挂账 D91）——**两句话指向的下一步不同，所以要说准**。
# 这正是 ADR-0017 那句「矩阵错误比不转换更糟」要防的反面：说出口，别假装。
