# 平台清单与成型规则
#
# **这份文件是数据不是代码**（`docs/platforms.md`）。加一个平台、改一条成型规则，
# 都不该动 Rust——工具内置这一份，`--manifest <文件>` 可以整份换掉。
#
# 三件事写在这里：
#
# 1. **哪些顶层目录算平台**。它同时是**范围边界**（ADR-0011 修订段）：未映射的顶层目录
#    整体不进识别管线，但**库体检照报**——那正是用户据以手动整理的依据。
# 2. **每个平台用哪几条成型规则**把散落的文件聚成**变体**。
# 3. **哪些扩展名只可能属于某一个平台**。目录说 GBA、文件是 NDS 这类冲突靠它认出来
#    （ADR-0011：目录是强先验而非权威）。
#
# 名字模式里 `#` 是一位数字、`@` 是一位字母、`*` 是任意长的尾巴，其余是字面量且
# 大小写不敏感（`platform::pattern`）。

"版本" = 1

# ════════════════════════════════════════════════════════════════════════
# 成型规则
# ════════════════════════════════════════════════════════════════════════
#
# 规则的**应用顺序由成型器固定**（目录树 → 同名成组 → 多碟同族），平台那边的
# `成型` 列表只说「用哪几条」，不说先后。理由：目录树一旦认下一棵子树，里面的文件
# 就是**内部资源**，不该再被同名成组捡一遍；而多碟同族合并的是前两步的产物。

# 光盘世代的一个变体常常是好几个文件：`.cue` 加它引用的 `.bin`、`.ccd` 加 `.sub`、
# 或者一个 `.chd` 旁边还躺着当初那份 `.cue`。判据是**同目录、同名**。
[["成型规则"]]
"名" = "光盘同名成组"
"方式" = "同名成组"
"组内扩展名" = [
  "cue", "bin", "img", "iso", "sub", "ccd", "mdf", "mds", "nrg",
  "toc", "raw", "gdi", "cdi", "chd", "ape", "wav", "flac", "sbi",
]
# **主文件取列表里最靠前的那一个。** `chd` 排在 `cue` 前面不是笔误：`.chd` 是
# **压缩镜像**，模拟器直接读它，它本身就是变体的形态（ADR-0014）；旁边那份 `.cue`
# 只是转换时留下的表单。让 `.cue` 当主文件会把一个能直接跑的东西降级成附属。
"主文件优先" = ["chd", "gdi", "cue", "ccd", "toc", "mds", "cdi", "nrg", "iso", "img", "bin"]
# 多轨光盘的轨道文件叫 `游戏 (Track 01).bin`。剥掉轨道标记之后它才和 `游戏.cue` 同名。
"轨道标记" = ["(track #)", "(track ##)", "track #", "track ##"]

# 一部**作品**发在三张碟上，磁盘上是三份文件（或三个目录），但它是**一个**变体。
# 判据：把每一级路径末尾的碟片标记剥掉之后，两条键完全相同。
#
# 只认**结尾**的标记，不认名字中间的——中间剥掉一段会把两截不相干的文字接到一起，
# 凭空造出同族。
[["成型规则"]]
"名" = "多碟同族"
"方式" = "多碟同族"
"碟片标记" = [
  "(disc #)", "(disc ##)", "(disc @)",
  "(disk #)", "(disk ##)", "(disk @)",
  "(cd #)", "(cd ##)",
  "[disc #]", "[disc ##]", "[disc @]",
  "disc #", "disc ##", "disc @",
  "disk #", "disk ##", "disk @",
  "cd #", "cd ##",
  "光盘#", "光碟#", "碟#", "第#碟", "第#张",
  "（光盘#）", "（碟#）",
]

# PS3 的转储是一整个目录：`PS3_GAME` 边上还有 `PS3_UPDATE`、`PARAM.SFO`。
# **变体是装着 `PS3_GAME` 的那个目录**，不是 `PS3_GAME` 自己——CONTEXT 里
# **主文件**的例子写的正是「`PS3_GAME` 所在目录」。
[["成型规则"]]
"名" = "PS3 目录树"
"方式" = "目录树"
"锚目录" = ["PS3_GAME"]
"变体根" = "上级"

# PSV 占全库 67% 的文件（171,073 个），绝大部分是 `at9` / `psarc` / `cpk` 这类
# **内部资源**。**这条规则若没把整棵目录树吞成一个变体，库里会炸出十几万条垃圾条目。**
#
# 真机上并存四种安装形态（`/Volumes/新加卷/Game/PSV`，2026-09-01 实地看过）：
#
# - NoNpDrm：`<游戏名>[TitleID]/app/<TitleID>/…`，边上还有 `patch/`、`addcont/`
# - MaiDump：`<游戏名>[TitleID]/<TitleID>/…`，补丁写成 `<TitleID>_patch`
# - TitleID 直接写在目录名里：`AIME00001(wan华镜 v3.1)/`
# - `.vpk` 安装包，或被 `.7z` / `.tar.zst` 这类**透明容器**裹着——那两种本来就是一个文件一个变体
#
# 前两种的锚都是 TitleID 目录，而 TitleID 目录**不是**变体：`app/` 与 `patch/` 下面
# 各有一个同名的 TitleID 目录，它们是同一个变体的两半。所以先穿过分区目录，再上一级。
[["成型规则"]]
"名" = "PSV 目录树"
"方式" = "目录树"
"锚目录" = ["PCS@#####", "PCS@#####_patch", "PCS@#####_addc", "@@@@#####*"]
"锚文件" = ["sce_sys/param.sfo", "eboot.bin"]
"分区目录" = ["app", "patch", "addcont", "rePatch", "license", "theme"]
# `addcont` 是 PSV 自己的目录约定，不是资源站编的分类名——按 ADR-0013，判据是
# **能否独立运行**，而这个目录里的追加内容离开本体跑不起来。它入库、算进变体，
# 但标成**附属内容**，导出时不成为前端条目。
"附属内容目录" = ["addcont"]
"变体根" = "上级"

# Wii U 的 loadiine 转储是 `<游戏名>/{code,content,meta}/`。这里锚目录就是变体根——
# 没有 PSV 那样的分区层。
[["成型规则"]]
"名" = "Wii U 目录树"
"方式" = "目录树"
"锚文件" = ["code/app.xml", "meta/meta.xml", "code/cos.xml"]
"变体根" = "锚目录"

# ════════════════════════════════════════════════════════════════════════
# 平台
# ════════════════════════════════════════════════════════════════════════
#
# `目录` 是这个平台认哪些顶层目录名（大小写不敏感、比较前过 NFC）。
# `扩展名` 是**只可能属于这个平台**的扩展名，用来认出「目录说 A、文件是 B」。
# 存疑的一律不填：`.iso` / `.bin` / `.cue` / `.zip` 跨平台，`.gb` 与 `.gbc` 互相
# 串目录是常态，填了只会把报告淹掉。

