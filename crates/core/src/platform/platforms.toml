# ════════════════════════════════════════════════════════════════════════
# 明确排除的目录
# ════════════════════════════════════════════════════════════════════════
#
# 与「还没映射」不是一回事：这些是**看过、决定不做**的。报告要把两者分开说，
# 否则每次读报告都会重新怀疑一遍是不是漏了。

[["范围外"]]
"目录" = ["pc"]
"理由" = "容量最大的一块（2.72 TiB、792 个文件），但不在议定的平台清单里，用户也不要求导出（docs/platforms.md 2026-08-31 的范围调整）"
