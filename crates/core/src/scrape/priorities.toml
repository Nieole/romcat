# 字段级多源优先级：哪个源的哪个字段说了算
#
# **这份文件是数据不是代码**（同 `platforms.toml`、`sources.toml`）。改一次优先级不该动
# Rust，也**不该重新采集一遍**——刮削结果是按「锚点 × 字段 × 源」三元组并存的，
# 改这份表只是换一次排序（调研 13.3(4)/(5)）。
#
# 工具内置这一份，`--priorities <文件>` 整份换掉，
# `romcat scrape --dump-priorities <文件>` 导得出底稿。
#
# ════════════════════════════════════════════════════════════════════════
# 三条规则。**改这份文件的人先读这一段。**
# ════════════════════════════════════════════════════════════════════════
#
# 1. **`裁决` 永远排第一。** 人改过的东西不许被任何数据源覆盖。Skyscraper 的文档说的是
#    同一件事：手工添加的资源 "will be prioritized above all others"。裁决这个源要等
#    票 08 才产出值，位置先占着——占着不花钱，忘了加才要命。
#
# 2. **没列到的源不报错**，排在全部列到的之后，彼此按采集时刻排（新的优先）。
#    于是加一个源不必先改这份表。
#
# 3. **按平台的覆盖压过通用那条**，整条替换而不是插进去。
#
# ════════════════════════════════════════════════════════════════════════
# 眼下有哪些源
# ════════════════════════════════════════════════════════════════════════
#
# | 源 | 本地/联网 | 给得出什么 |
# |---|---|---|
# | `裁决` | 本地 | 人工定的一切（票 08） |
# | `No-Intro` | 本地 | 标题。卡带世代条目名最整齐 |
# | `Redump` | 本地 | 标题。光盘世代 |
# | `TOSEC` | 本地 | 标题、**年份**、**发行商**、**汉化组**——后三样只有它给得出 |
# | `MAME` | 本地 | 标题。逐芯片的记录，街机之外不如 No-Intro |
# | `GoodNES` | 本地 | 标题。它只记 SHA-1，第一命中层撞不到，实际暂时没有值 |
# | `文件名` | 本地 | 标题。**兜底**：46,444 个变体里有 16,420 个 DAT 认不出来 |
# | `本地媒体` | 本地 | 媒体。主库里现成的封面、截图与视频 |
#
# 在线源（ScreenScraper、IGDB、Bangumi…）是票 14 的活。它们进来时**只需要在这份表里
# 加名字**，不必动任何 Rust——那正是这套机制的意义。

"版本" = 1

# ════════════════════════════════════════════════════════════════════════
# 通用顺序
# ════════════════════════════════════════════════════════════════════════

[["字段"]]
"名" = "标题"
"顺序" = ["裁决", "No-Intro", "Redump", "MAME", "TOSEC", "GoodNES", "文件名"]
"说明" = """
No-Intro 与 Redump 的条目名最整齐（`1942 (Japan, USA) (En)`），剥掉标记组就是干净的
作品名。TOSEC 排在后面是因为它的名字里塞满了发行日期与小组名，而且同一部作品在不同
DAT 里的写法更散。`文件名` 垫底但**必须在**：DAT 认不出来的那 16,420 个变体，标题只能
从文件名来，否则前端里是一片空白。"""

[["字段"]]
"名" = "年份"
"顺序" = ["裁决", "TOSEC"]
"说明" = """
**只有 TOSEC 给得出。** No-Intro 与 Redump 的条目名里根本没有发行日期。
这一条就是「字段级优先级」最直接的证据：按源排的话，「No-Intro 优先」等于把年份丢掉。"""

[["字段"]]
"名" = "发行商"
"顺序" = ["裁决", "TOSEC"]
"说明" = "同年份，只有 TOSEC 的第二个括号给得出。"

[["字段"]]
"名" = "汉化组"
"顺序" = ["裁决", "TOSEC"]
"说明" = """
TOSEC 的 `[tr zh <组>]`。**这是官方数据库补不上的那一块**——No-Intro 与 Redump 在政策上
永不收录修改版，而汉化版正是这个库的痛点（ADR-0008）。"""

[["字段"]]
"名" = "开发商"
"顺序" = ["裁决"]
"说明" = "**离线档补不上。** 留着位置，等票 14 的在线源。"

[["字段"]]
"名" = "类型"
"顺序" = ["裁决"]
"说明" = "**离线档补不上。** 留着位置，等票 14 的在线源。"

[["字段"]]
"名" = "简介"
"顺序" = ["裁决"]
"说明" = """
**离线档补不上，而且这是离线路线最大的一个缺口。** 调研的结论：中文简介只有 Bangumi 与
ScreenScraper 的 `synopsis_zh` 给得出，而 Bangumi 的离线 dump 也不含图片。
这一栏空着是**如实的**，不是漏了。"""

# ════════════════════════════════════════════════════════════════════════
# 按平台覆盖
# ════════════════════════════════════════════════════════════════════════

[["平台覆盖"]]
"平台" = "街机"
"字段" = "标题"
"顺序" = ["裁决", "MAME", "No-Intro", "TOSEC", "文件名"]
"说明" = """
**街机上 MAME 是权威**（ADR-0010）：它的 parent/clone 与条目名就是这个领域的事实标准，
而 No-Intro 与 Redump 根本不做街机。别的平台上反过来——MAME 的 software list 是**逐芯片**
的记录，条目名不如 No-Intro 整齐，所以只在这里翻过来。"""
