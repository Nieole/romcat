# 字段级多源优先级：哪个源的哪个字段说了算
#
# **这份文件是数据不是代码**（同 `platforms.toml`、`sources.toml`）。改一次优先级不该动
# Rust，也**不该重新采集一遍**——刮削结果是按「锚点 × 字段 × 源」三元组并存的，
# 改这份表只是换一次排序（调研 13.3(4)/(5)）。
#
# 工具内置这一份，`--priorities <文件>` 整份换掉，
# `romcat scrape --dump-priorities <文件>` 导得出底稿。
#
# ════════════════════════════════════════════════════════════════════════
# 三条规则。**改这份文件的人先读这一段。**
# ════════════════════════════════════════════════════════════════════════
#
# 1. **`裁决` 永远排第一，手工维护的元数据紧随其后。** 人改过的东西不许被任何
#    数据源覆盖。`Pegasus` 是维护者多年手工养出来的那一份（票 16 导进来的），
#    `ES-Gamelist` 是同一类东西——他自己那台 ES-DE 上编辑出来的，或者从社区拿来的
#    现成元数据包（票 17）。两个都不是猜出来的、也不是撞出来的——排在全部数据源
#    之前，否则一次刮削就把它盖掉了，
#    而那正是 ADR-0001 说「这个代价不可接受」的那件事。Skyscraper 的文档说的是
#    同一件事：手工添加的资源 "will be prioritized above all others"。裁决这个源要等
#    票 08 才产出值，位置先占着——占着不花钱，忘了加才要命。
#
# 2. **没列到的源不报错**，排在全部列到的之后，彼此按采集时刻排（新的优先）。
#    于是加一个源不必先改这份表。
#
# 3. **按平台的覆盖压过通用那条**，整条替换而不是插进去。
#
# ════════════════════════════════════════════════════════════════════════
# 眼下有哪些源
# ════════════════════════════════════════════════════════════════════════
#
# | 源 | 本地/联网 | 给得出什么 |
# |---|---|---|
# | `裁决` | 本地 | 人工定的一切（票 08） |
# | `Pegasus` | 本地 | **维护者手工维护的前端元数据**导进来的那些（票 16） |
# | `ES-Gamelist` | 本地 | 同上，只是格式是 ES gamelist（票 17）。Cocoon / iiSU / Daijishō 三家安卓前端与中文社区分享的元数据包都是这个 |
# | `No-Intro` | 本地 | 标题。卡带世代条目名最整齐 |
# | `Redump` | 本地 | 标题。光盘世代 |
# | `TOSEC` | 本地 | 标题、**年份**、**发行商**、**汉化组**——后三样只有它给得出 |
# | `MAME` | 本地 | 标题。逐芯片的记录，街机之外不如 No-Intro |
# | `GoodNES` | 本地 | 标题。它只记 SHA-1，第一命中层撞不到，实际暂时没有值 |
# | `中文离线源` | 本地 | **中文标题**（变体层）与**类型**、**中文简介**、**开发商**、**发行商**（作品层）。文件名撞中文离线数据源撞出来的，带平台与年份两道交叉校验（票 11、票 02、票 03、票 04） |
# | `中文离线源·别名` | 本地 | 同一次撞出来的那条条目**还叫什么**。只进标题集合、只管搜得到 |
# | `文件名` | 本地 | 标题。**兜底**：46,444 个变体里有 16,420 个 DAT 认不出来 |
# | `本地媒体` | 本地 | 媒体。主库里现成的封面、截图与视频 |
# | `ScreenScraper` | **联网** | **封面**——那是它唯一不可替代的那一样；类型票 02 之后、简介票 03 之后、开发商与发行商票 04 之后，离线档自己都有了 |
#
# `ScreenScraper` **只在 `--profile 在线` 那一趟参加**。离线档跑的时候它不在场，
# 于是排在哪儿都不影响结果——这正是「两个档位共用同一份表」成立的原因：
# 换档案不必换表，也不必重新采集。
#
# ⚠️ 它有一份**专门的「当日未识别 ROM」配额**，撞穿了连账号带 IP 一起永久封禁
# （ADR-0007）。工具因此只对**已确认**的条目发请求，并默认限流。把它往前排不会
# 多发一个请求——名次只决定「都有值的时候听谁的」。

"版本" = 1

# ════════════════════════════════════════════════════════════════════════
# 通用顺序
# ════════════════════════════════════════════════════════════════════════

[["字段"]]
"名" = "标题"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "No-Intro", "Redump", "MAME", "TOSEC", "ScreenScraper", "GoodNES", "中文离线源", "文件名", "中文离线源·别名"]
"说明" = """
No-Intro 与 Redump 的条目名最整齐（`1942 (Japan, USA) (En)`），剥掉标记组就是干净的
作品名。TOSEC 排在后面是因为它的名字里塞满了发行日期与小组名，而且同一部作品在不同
DAT 里的写法更散。`文件名` 垫底但**必须在**：DAT 认不出来的那 16,420 个变体，标题只能
从文件名来，否则前端里是一片空白。

`ScreenScraper` 排在 DAT 各家之后而在 `文件名` 之前：标题这一栏离线档本来就填得满，
它在这里只是比文件名强的一层兜底。**中文标题的正解是票 15 的标题集合**，不是把某个
在线源提到最前——那一层要按语言挑，不是按源挑。

`中文离线源` 紧挨在 `文件名` 前面，理由也在标题集合那一层：两者给的都是**中文别名**，
而这一栏的名次只在**同一档之内**才起作用——分档靠置信度，而中文离线源那一条有出处
（平台与年份两道交叉校验都对上），文件名那一条谁也没背书。名次在这里只是个兜底的
定序，真正的差别写在置信度上。

`中文离线源·别名` **垫在最后一位，这是有意的**。它给的是同一次撞上的那条条目**还叫
什么**——那些叫法该进**标题集合**（一部作品的几个叫法，用户搜哪个都该找得到），
但**不该当显示标题**：一个文件的标题该是它自己撞上的那个名字，不是那条条目的另一个
写法。排在 `文件名` 之后，它就只在「这个变体一个标题都没有」时才轮得到——
而那时有一个有出处的叫法总比一片空白强。

⚠️ **这张表管不住标题集合那一层的排序。** `title::choose` 的排序键里，语言与类型的档位、
以及**置信度**都排在这张表的名次前面（`title::rank`）。别名不当显示标题这件事真正靠的是
它被判成**低置信**（`title::classify`），与文件名同档；这张表只在同档之内分先后。
改这两处任何一处之前，先看另一处。"""

[["字段"]]
"名" = "年份"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "TOSEC", "ScreenScraper"]
"说明" = """
**离线这一侧只有 TOSEC 给得出。** No-Intro 与 Redump 的条目名里根本没有发行日期。
这一条就是「字段级优先级」最直接的证据：按源排的话，「No-Intro 优先」等于把年份丢掉。
在线档再补一层，排在 TOSEC 之后——TOSEC 的日期跟着那一条 DAT 记录走，更贴近手上这一份。"""

[["字段"]]
"名" = "发行商"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "TOSEC", "ScreenScraper", "中文离线源"]
"说明" = """
TOSEC 排在最前面（人工那三家之后）是因为它的发行商跟着**那一条 DAT 记录**走——那是
按哈希确认的、贴着手上这一份文件的结论；后面两家给的都是**作品级**的，多平台移植上会
把发行方说成最出名的那一家。

`中文离线源` 票 04 接上来（实测 78.5% 的中文条目 infobox 写着 `|发行=`），垫在
`ScreenScraper` 之后，与**标题**、**类型**、**简介**三条链上的相对位置一致：它撞的是
**名字**不是字节，是模糊匹配来的中置信结论。

⚠️ **离线档里 TOSEC 是在场的**，所以这一栏跑默认那一趟时多半仍由 TOSEC 说了算，
中文离线源只在 TOSEC 认不出那个文件时才轮得到——而那正是这个库里 16,420 个变体的处境。
类型与简介那两栏不同（那两栏离线这一侧只有中文离线源给得出），别把三条链读成一回事。

一个键写了好几家时**拆成好几条**进库（`|发行= 甲、乙` 与多值块两种写法都拆）。
这张表一个字段只挑得出一条，挑的是排序键第四层（值本身）定的那一条。"""

[["字段"]]
"名" = "汉化组"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "TOSEC"]
"说明" = """
TOSEC 的 `[tr zh <组>]`。**这是官方数据库补不上的那一块**——No-Intro 与 Redump 在政策上
永不收录修改版，而汉化版正是这个库的痛点（ADR-0008）。"""

[["字段"]]
"名" = "开发商"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "ScreenScraper", "中文离线源"]
"说明" = """
**离线档补得上了**（票 04）：中文离线源撞上一条中文条目之后，那条条目的 infobox 里
写着 `|开发=`，实测覆盖率 83.8%。它挂在**作品**这一层——开发商跨平台跨地区都成立。

它排在 `ScreenScraper` **之后**，与标题、类型、简介三条链上的位置一致：中文离线源撞的是
**名字**不是字节，是模糊匹配来的中置信结论；在线源那一边是按哈希确认的条目。
**离线档里 ScreenScraper 根本不在场**，而 DAT 那几家一条开发商都给不出——所以跑默认
那一趟时，这一栏由中文离线源来填。

一个键写了好几家时**拆成好几条**进库（`|开发= 甲、乙` 与多值块两种写法都拆）：
用户在前端里按开发商筛的时候，「甲、乙」与「甲」是两个不同的东西。这张表一个字段只
挑得出一条，挑的是排序键第四层（值本身）定的那一条。"""

[["字段"]]
"名" = "类型"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "ScreenScraper", "中文离线源"]
"说明" = """
**离线档补得上了**（票 02）：中文离线源撞上一条中文条目之后，那条条目的 infobox 里
写着游戏类型，实测覆盖率 99.7%。它挂在**作品**这一层——类型跨平台跨地区都成立，
挂到变体上就是同一部作品的每个变体各存一份重复内容。

它排在 `ScreenScraper` **之后**，与标题那条链上的位置一致：中文离线源撞的是**名字**
不是字节，是模糊匹配来的中置信结论；在线源那一边是按哈希确认的条目。离线档跑的时候
`ScreenScraper` 根本不在场，这一栏于是由中文离线源来填。"""

[["字段"]]
"名" = "简介"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "ScreenScraper", "中文离线源"]
"说明" = """
**离线档现在也补得上了**（票 03）：中文离线数据源里 94.2% 的游戏条目带中文简介，
撞上一条条目就一并取回，**一个网络请求都不发**。简介挂**作品**那一层——同一部作品的
几个变体不该各存一份相同的简介。

`中文离线源` 垫在 `ScreenScraper` 之后，与**标题**、**类型**两条链上的相对位置一致：
它撞的是**名字**不是字节，是模糊匹配来的中置信结论，而在线源那一边是按哈希确认的条目。
**离线档里 ScreenScraper 根本不在场**，所以这个名次不影响 `romcat scrape` 默认那一趟。

在线源取简介时**中文排在最前**（`zh` → `cn` → `en`）；它给的多半是英文，而这一栏要的
是中文——那正是把离线那一路排进来的理由。

超过 4,000 字的简介会被**截断**并在末尾留一句说明，被截断的锚点在刮削报告里逐条点名。"""

# ════════════════════════════════════════════════════════════════════════
# 按平台覆盖
# ════════════════════════════════════════════════════════════════════════

[["平台覆盖"]]
"平台" = "街机"
"字段" = "标题"
"顺序" = ["裁决", "Pegasus", "ES-Gamelist", "MAME", "No-Intro", "TOSEC", "文件名"]
"说明" = """
**街机上 MAME 是权威**（ADR-0010）：它的 parent/clone 与条目名就是这个领域的事实标准，
而 No-Intro 与 Redump 根本不做街机。别的平台上反过来——MAME 的 software list 是**逐芯片**
的记录，条目名不如 No-Intro 整齐，所以只在这里翻过来。"""
