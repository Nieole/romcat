# 文件名剥离规则
#
# **这份文件是数据不是代码**（与 `platform/platforms.toml` 同一条道理）。库里的文件名
# 是十几年间几十个汉化组、几十个整理者各写各的，规律只会不断冒出新的——每冒一条就改
# 一次 Rust，这一层就永远追不上。工具内置这一份，`--name-rules <文件>` 换成自己的。
#
# **默认是「补充」不是「换掉」**：`"继承内置" = true`（默认值）时，下面每张表都**接在**
# 内置那一份后面。维护者遇到一个新汉化组，写三行就够，不必把内置的三百多条抄一遍——
# 而抄一遍的那份会在下次升级时悄悄落后。要整份换掉就写 `"继承内置" = false`。
#
# 模式那几张表用的是成型规则里那套极小的名字模式（`platform::pattern`）：
# `#` 一位数字、`@` 一位字母、`*` 任意尾巴，其余字面量且大小写不敏感。

"版本" = 1
"继承内置" = true

# ════════════════════════════════════════════════════════════════════════
# 记号组
# ════════════════════════════════════════════════════════════════════════
#
# 库里的记号写在四种括号里：`[…]`、`(…)`、`【…】`、`（…）`。剥离的第一步是把它们
# 整组切下来，再逐组归类——**归类不对，剥掉的就可能正是标题本身**
# （`【真·三国无双】` 那种把正题整个括起来的写法真实存在，见下面「整个名字就是一组」）。

# 一组记号里含这些词之一 → 这一组是**汉化组**署名，整组留着当组名。
#
# 「移植」在这里不是笔误：`【中文移植】`、`[jinjia汉化移植]` 都是这个库里的真实写法，
# 而移植者与汉化组在这份库里是同一类署名。
"汉化组词" = [
  "汉化", "漢化", "汉化组", "漢化組", "翻译", "翻譯", "润色", "潤色",
  "精翻", "移植", "美化", "重制", "重製", "补丁", "補丁", "修改",
]

# 直接点名的汉化组与整理者。**这张表只收那些名字里不带「汉化」二字的**——带的那些
# 上面一条已经认掉了，重复列只会让维护变成两处。
"汉化组名" = [
  "acg", "星组", "漫游", "狼组", "天使", "外星科技", "口袋群星", "扑家",
  "pspchina", "teampb", "mai200", "mai", "xzonn", "yome", "兔友", "史莱姆",
  "启航", "fhz", "hyopo", "necrosaro", "utunnels", "werther", "angel_poon",
  "d商", "dmg", "jinjia", "play汉化组", "ms emumax", "emumax", "dwt_so",
]

# 一组记号整组等于这里的某一项 → **语言或地区**记号，剥掉（读出来的语言写进依据）。
#
# 单字母那几个（`j` / `u` / `e`）是 GoodTools 的国别码，真库里满地都是。
"语言地区" = [
  "简", "繁", "中", "日", "英", "美", "欧", "亚", "港", "台", "韩",
  "简体", "繁體", "繁体", "中文", "日文", "英文", "韩文",
  "简中", "繁中", "中日", "简繁", "简体中文", "繁体中文",
  "日版", "美版", "欧版", "亚版", "港版", "台版", "国行", "港英", "港中",
  "j", "u", "e", "c", "ch", "cn", "jp", "us", "eu", "as", "hk", "tw", "kr",
  "japan", "usa", "china", "europe", "korea", "taiwan", "asia", "world",
  # 下面这一批是**真机第一趟报出来的「认不出的记号」**照着补的——这正是
  # `Parsed::unknown` 那一栏存在的理由：跑一遍、看报告、补配置、再跑一遍。
  "chs", "cht", "gb", "big5", "簡", "簡中", "繁中", "简中", "国服", "国服版",
  "官中", "官方简中", "官方繁中", "官方中文", "简体中文版", "繁体中文版",
  "ntsc", "ntsc-j", "ntsc-u", "pal", "日版汉化", "美版汉化",
]

# 一组记号**匹配**这里的某条模式 → **版本**，剥掉并记下来（依据里要写）。
"版本模式" = [
  "v#*", "v.#*", "ver#*", "ver.#*", "版本#*", "第#版", "#.#", "#.##", "#.###",
  "rev @", "rev #", "r#", "beta*", "alpha*", "demo", "试玩版", "体验版",
]

# 一组记号**匹配**这里的某条模式 → **容量**，剥掉。
#
# `(128Mb)` 是这个库里 GB / GBA / NDS 那几个整理包的固定写法，说的是卡带容量。
"容量模式" = [
  "#mb", "##mb", "###mb", "####mb", "#.##mb", "##.##mb", "###.##mb",
  "#m", "##m", "###m", "####m", "#gb", "#.#gb", "#.##gb", "#kb", "##kb",
]

# 一组记号整组等于这里的某一项 → **噪音**，剥掉。
#
# 与下面那张「正题噪音词」分开，是因为这一张是**整组比对**（`[中文DLC]` 整组就是噪音），
# 那一张是**从正题两头剥**（`唐老鸭汉化版` 要剥掉尾巴上的三个字）。两件事混成一张表，
# 就会有人往这里加一个短词，然后整批标题被从中间剪断。
"记号噪音" = [
  "rom", "cia", "rom+cia", "iso", "vpk", "nsp", "xci", "3ds", "nds",
  "汉化", "漢化", "完美汉化", "完全汉化", "中文", "中文dlc", "全dlc", "dlc",
  "推荐", "新版", "旧版", "修正", "修复", "完美", "最终", "典藏", "珍藏",
  "带预览", "无语言需求", "原版", "精品", "全集", "合集", "整理",
  # 同上：真机第一趟报出来的。`pd` 是 GoodTools 的 public domain 记号，
  # `!` 是它的「已验证是好转储」记号。
  "pd", "!", "h", "a", "b", "p", "t", "o", "f",
  "修正版", "修复版", "完美版", "最终版", "增强版", "加强版", "重制版",
]

# ════════════════════════════════════════════════════════════════════════
# 正题
# ════════════════════════════════════════════════════════════════════════

# 从正题**两头**反复剥掉的噪音词。**只剥两头，绝不从中间挖**——`中文课堂` 里那两个字
# 是标题的一部分，从中间挖会把它变成 `课堂`。
"正题噪音词" = [
  "完美版", "最终版", "中文版", "汉化版", "漢化版", "简体版", "繁体版",
  "简体中文版", "繁体中文版", "中文化", "汉化", "漢化", "简体", "繁體", "繁体",
  "中文", "日文版", "英文版", "日版", "美版", "欧版", "港版", "台版",
  "完整版", "典藏版", "珍藏版", "收藏版", "修正版", "修复版", "移植版",
  "试玩版", "体验版", "公测版", "内测版", "正式版", "免安装", "全屏",
  "拉伸", "完美显示", "汉字",
]

# 正题开头的**分类**词，后面跟着一个冒号时剥掉：`033.動作：古髏人拿双劍`、
# `69.体育：足球-日本J聯盟95` 是同一个整理包的写法，分类不是标题的一部分。
#
# 这张表还兼一个用处：正题**尾巴**上由 `-` 或 `_` 分出来的最后一段整段等于其中一项时
# 也剥掉（`超级食肉男-美版-休闲益智`）。
"分类词" = [
  "動作", "动作", "射擊", "射击", "格鬥", "格斗", "體育", "体育", "運動", "运动",
  "益智", "智力", "冒險", "冒险", "策略", "模擬", "模拟", "角色", "角色扮演",
  "競速", "竞速", "賽車", "赛车", "休閒", "休闲", "休闲益智", "養成", "养成",
  "音樂", "音乐", "棋牌", "麻將", "麻将", "飛行", "飞行", "射击游戏", "其他",
]

# 正题**开头**的平台词，剥掉。`GBC海贼王`、`FC唐老鸭大冒险2`、`PSV超级机器人大战V`
# 都是这个库里的真实写法——整理者拿平台名当前缀，而它不是标题的一部分。
#
# **只剥开头、而且后面还得剩下东西**：`GBA` 单独一个名字剥完就空了，那时原样留着。
"平台前缀" = [
  "fc", "nes", "sfc", "snes", "gb", "gbc", "gba", "gbavc", "nds", "ndsi",
  "3ds", "n64", "md", "ss", "dc", "pce", "ps", "ps1", "psx", "ps2", "ps3",
  "psp", "psv", "wii", "wiiu", "ngc", "gc", "switch", "ns", "街机", "vc",
]

# 正题开头的**编号**后面跟着的分隔符。`033.動作：古髏人拿双劍`、`1741 - 梦想灯笼`、
# `3.FC经典游戏` 都是整理包里的编号，不是标题。
#
# **判据是「开头一串数字加一个分隔符」**，光有数字不算——`1942` 与 `2048` 是真游戏名。
"编号分隔" = [".", "、", "-", "－", "_", ":", "：", "．", " ", "　"]

