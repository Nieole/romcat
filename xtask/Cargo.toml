# **门禁跑手。** README「开发」一节那四条命令的**唯一**定义住在这个 crate 里，
# 本地与 CI 都只调 `cargo xtask gate`，不各抄一份。
#
# 它**不是交付出去的东西**：`crates/` 下那三个才是（`romcat-core` / `romcat` / `romcat-gui`），
# 这一个既不被它们依赖、也不进它们的二进制——`cargo build --release` 之外它一行都不参与。
# 摆在仓库根而不是 `crates/` 下，正是为了让这条界线看得见（这也是 cargo 社区的
# `xtask` 惯例：一个 workspace 成员 + 一条 `cargo` 别名）。
#
# 它自己**在 workspace 里**，于是门禁四条（fmt / clippy / test / doc）照样盖着它——
# 门禁跑手自己不守门禁是最难查的一类漏。
[package]
name = "xtask"
description = "门禁跑手：README「开发」一节那四条命令的唯一定义"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# 与 `romcat-cli` / `romcat-gui` 一套写法，`--help` 也顺带有了。
clap.workspace = true

[lints]
workspace = true
