# ⚠️ **仓库还没按这份配置格式化过。** 这份文件先落地、格式化后落——整仓库跑一遍
# 与「把 `cargo fmt --check` 加进门禁」是票 `queue-followups/11` 的活，它排在那一批最后，
# 因为它一落地所有在飞的改动都冲突。**在那之前别跑 `cargo fmt --all`**：眼下它会动 77 个
# 文件、2,252 行，全是与你手上那张票无关的改动（这一下已经发生过一次，挂单 `Q53`）。
# `cargo fmt --all --check` 是只读的，随便跑；现在它 exit 1，那是应该的。

# `rustfmt` 配置。**这份文件只有三项**——那不是偷懒，是量出来的结论：
# 这个仓库的手工排版本来就贴着 rustfmt 的默认值，**试过的每一处偏离都让 diff 变大**——
# 唯一的例外是关掉 `reorder_imports`，而那一处不值得换。整份矩阵的实测数
# （票 `queue-followups/10` 的试跑）逐条记在下面「量过但不设的项」里。
#
# 前提一件，先说清楚：**`rustfmt` 按显示列宽算，不按字符数算。**
# 实测——70 个汉字（70 个字符 / 140 列）的调用参数，即使把 `fn_call_width` 提到 100
# 也照样被拆开；同样结构的 70 个 ASCII 字符则原样留在一行。
# 所以下面 `max_width = 100` 里的 100 是**一百列**，一行 50 个汉字就到顶了。
# 这条正好是这个全中文仓库能用默认值的原因：人写的代码行 p99 是 92 列，本来就在 100 以内。

# 解析器用哪个版本的语法。`cargo fmt` 会从 `Cargo.toml` 的 `edition` 带上这一项，
# 但**裸跑 `rustfmt x.rs`（编辑器保存时格式化走的就是这条）默认按 2015 解析**，
# 撞上 edition 2024 的 let 链（`if a && let Some(b) = c`）直接报语法错。写在这儿它才认得。
edition = "2024"

# 排版规则用哪个版本的《风格指南》（RFC 3338）。不写它也会跟着 `edition` 取 2024，
# 写出来是为了**钉住**：实测 style_edition 2021 与 2024 在这个仓库上差 1,123 行，
# 将来 rustfmt 把默认挪到 2027，不该由一次工具链升级顺手重排全仓库。
style_edition = "2024"

# 一行最多一百**列**（见开头那段：汉字算两列）。与默认值同值，写出来是给这个数一个
# 挂解释的地方——全中文仓库里「100」这个数最容易被误读成「100 个字」。
max_width = 100

# ── 量过但**不设**的项 ──
# （票 `queue-followups/10` 的试跑；基准＝纯默认，77 个文件 / +1,484 −768 行）
#
# `fn_call_width`（默认 60）：调大能救回「一行本来只有 79 列、却因为参数超过 60 列被拆成
#   五行」那一类。但它同时会把人**有意折开**的调用并回一行——实测 70 → 155 个文件
#   （删除侧从 768 行涨到 3,427 行）、80 → 165 个文件，diff 直接翻倍。**保持默认。**
# `chain_width`（默认 60）：同上，70 → 142 个文件、80 → 156 个文件。**保持默认。**
# `struct_lit_width`（默认 18）：30 → 110 个文件、40 → 126 个文件。**保持默认。**
# `array_width=80` / `single_line_if_else_max_width=80` / `match_block_trailing_comma=true` /
#   `fn_params_layout=Compressed`：同样都只把 diff 做大（103 / 108 / 130 / 128 个文件）。
# `use_small_heuristics`：`Max` 与 `Off` 是最坏的两个——各改 190 / 186 个文件
#   （全仓库 196 个 `.rs`），因为它们会把成片手工折行整段并回去。**保持 `Default`。**
# `short_array_element_width_threshold`（默认 10）：**这一项是唯一真有取舍的。**
#   全仓库手写的紧凑表（一行 ≥3 个字符串字面量）共 29 张，默认值下保住 22 张、
#   摊平 7 张——7 张全在 `crates/cli/tests/triage.rs`，倒霉在 `"--workspace"` 是 13 个字符，
#   而这条规则要求表里**每一个**元素都不超过阈值。调到 15 那 7 张全保住，代价是
#   全仓库从 77 个文件 / 2,252 行涨到 85 个文件 / 2,404 行——因为它同时会把别处
#   人手写成一行一个的短元素数组**并**成紧凑表（删除侧 768 → 943 行）。
#   **不设**：一个全局阈值既救表也改别处的表，而 `#[rustfmt::skip]` 是**就地、显式**的，
#   仓库里已有先例且实测有效（`crates/gui/src/layout.rs` 的 `ALL`，试跑跑完原样未动）。
#   这 7 张表怎么办交给票 `queue-followups/11`（挂单 `Q182`）。
#   注意阈值救不回带长元素的那一类（`&workspace.path().to_string_lossy()` 是 35 个字符），
#   那一类只有 `#[rustfmt::skip]` 一条路。
# `reorder_imports`：唯一一个关掉能让 diff 变小的（77 → 71 个文件），但只省 52 行，
#   而它换来的是 `use` 永远排好序。**保持默认 `true`。**
# `newline_style`：保持默认 `Auto`（按文件首个换行符走）。主力机是 Windows（ADR-0018），
#   仓库里没有 `.gitattributes`；钉成 `Unix` 会让 CRLF 检出的工作区整仓库 `--check` 失败。
# `wrap_comments` / `error_on_line_overflow` / `format_strings` / `imports_granularity`：
#   **稳定版根本设不了**（写进来只会让每次 `cargo fmt` 打一行 "unstable features are only
#   available in nightly channel" 的警告）。它们的默认值恰好都是我们要的——
#   `wrap_comments` 默认 `false`，实测跑完 141,803 行，**没有一行注释被重新折过**：
#   长中文注释与注释里的对齐表格是安全的，会动的只有代码。
