[workspace]
resolver = "3"
# `xtask` 不是交付出去的东西，是**门禁跑手**（`cargo xtask gate`）。
# 放进 workspace 是为了让门禁那几条照样盖着它——门禁跑手自己不守门禁是最难查的一类漏。
members = ["crates/core", "crates/cli", "crates/gui", "xtask"]
# 不点包名时（`cargo build --release`）只建交付的那三个：`xtask` 是门禁跑手，
# 不该在 `target/release/` 里落一个不是交付物的二进制——照 `target/release/*` 打包的人会捡走它。
# 门禁里排版与编译的那几条不是显式带 `--workspace` 就是走 `--all`（`fmt` 那条），**照样盖着 `xtask`**，这一行不放过它。
# （`glossary` 那条不编译，扫的是 git 改动里 `crates/` 下的代码，与这一行无关。）
default-members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
romcat-core = { path = "crates/core" }
# 界面层（ADR-0005）。**版本下限锁 0.35**：中文输入最致命的两个 bug——回车上屏在多行
# 输入里多插一个换行、组字时退格误删已有文字——2026-03-24 才修掉，随 0.35.0 发布，
# 一切基于 0.34 及更早版本的中文输入评价都已作废。这里钉的 0.36 正是
# `docs/research/egui-viability.md` 逐条核实过的那一版（0.36.1），它把工作区的
# `rust-version` 顶到了 1.95。
#
# `eframe` 走默认的 wgpu 后端：glow 那条路在 macOS 上依赖已被系统弃用的 OpenGL。
egui = "0.36"
eframe = "0.36"
# 十万行表格靠它的 `TableBuilder`：`TableBody::rows` 的开销与总行数无关。
# 它**没有排序能力**（源码里 `sort` 零出现），所以排序下推到 SQLite——
# 那本来也是「绝不把全库载入内存」的既定做法。
egui_extras = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# 中立库是事实来源，落在 SQLite 上（ADR-0001）。`bundled` 把 SQLite 源码一起编进来，
# 免得依赖各台机器上碰巧装了哪个版本的系统库——主力机是 Windows（ADR-0018）。
# `functions` 把核心库里**那一处**领域判断挂成 SQL 函数，筛选与计数才下推得了、不必在
# SQL 里另写一份判据（ADR-0024；`catalog::browse` 的非游戏资产那一段）。它不带新依赖。
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
# 路径以 NFC 规范化后才作为键（ADR-0020）。
unicode-normalization = "0.1"
# 平台清单与成型规则是**数据不是代码**（docs/platforms.md、票 05）。选 TOML 而不是
# 已经在依赖里的 JSON，是因为这份清单每条规则都得写清「为什么这么定」——JSON 没有注释，
# 而没有注释的规则表下一个人只能靠猜（挂账 D33）。
toml = "1"
flate2 = "1"
# DAT 是 XML（Logiqx DTD 与 No-Intro 自有 XSD，见票 06）。自己写 XML 解析器要处理
# 实体引用、CDATA、DOCTYPE 与属性引号，那是经典的自伤——DAT 里的游戏名真的带 `&amp;`。
# 钉在 0.38：0.42 把 API 整体从字节改成了 `&str`，实体引用也拆成了独立的
# `Event::GeneralRef` 事件——那等于要自己维护一张命名实体表，正是引这个库要躲开的活。
quick-xml = "0.38"
# 取 DAT 要联网。选阻塞式的 ureq 而不是 reqwest：这个代码库没有 async 运行时，
# 为了下几个文件引一整套 tokio 不划算。TLS 走 rustls，不依赖各机器上的系统库。
ureq = "3"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
# `.zst` 是主库里容量第二大的扩展名（2,685 个文件、2.50 TiB，`docs/library-facts.md`）。
# 选官方绑定而不是纯 Rust 的 `ruzstd`：这条路上要读的是 2.50 TiB 真实字节，参考实现
# 是唯一不必自己承担「解码器有没有边角 bug」的选择，而 C 工具链本来就已经是硬前提
# （`rusqlite` 的 `bundled` 与 `ring` 都编 C）。关掉三个默认特性：`legacy` 是 2016 年
# 之前的 v0.x 帧（真库里不存在，认出来也只该如实报「旧版帧格式」），
# `zdict_builder` 是训练字典的（本项目只解压、从不压缩），`arrays` 只影响 zstd-safe 的
# 常量数组 API。
zstd = { version = "0.13", default-features = false }
# `.zst` 的实际形态多为 `.tar.zst`。tar 这一层**不自己写**——调研 2.5 实测 bsdtar 默认
# 产出 pax：第一个 512 字节块是 `PaxHeader/…` 伪条目（`typeflag='x'`），真条目在偏移
# 1024，「读前 512 字节取文件名」是错的。pax、GNU longname 与 sparse 这三个坑这个 crate
# 都已经趟平了，而它们与本项目要解决的问题毫无关系。关掉 `xattr`：那是**解包**时
# 往磁盘写扩展属性用的，而这里只读不写（ADR-0004）。
tar = { version = "0.4", default-features = false }
# 容器里的内部文件名**不保证是 UTF-8**：zip 只有在通用标志位第 11 位置位时才保证，
# 其余是「本地代码页」。真库实测 21,901 条内部名字不是合法 UTF-8，多半是 GBK。
# 名字一旦参与匹配（票 11），有损转换就成了实打实的问题，于是要先探编码再解码——
# 而 GBK / Big5 / Shift_JIS 的**码表**不是能手写的东西（GBK 一家两万三千条映射）。
# 选 encoding_rs 而不是自己抄一份表：它是 WHATWG Encoding 标准的参考实现（Firefox 在用），
# 纯 Rust、无 C 依赖、只解码不联网。
encoding_rs = "0.8"
# **媒体池**按内容哈希存（ADR-0009），要一个货真价实的摘要——CRC-32 是校验不是指纹，
# 32 位在几万份媒体上撞一次就是一张封面悄悄变成另一张。选 `ring` 而不是 `sha2`：
# 它**已经在依赖树里**（ureq 的 rustls 后端用它），直接依赖不多编译一行代码，
# 而 RustCrypto 那一套要新拉五六个 crate。
ring = "0.17"
# **图片得解码成像素才画得出来**（票 `gui-redesign/07`）：egui 自己不解码，`ColorImage`
# 要的是一片 RGBA。选 `image` 而不是自己写解码器，理由与当年选 `quick-xml` 同源——
# 自己写 JPEG 解码器要处理霍夫曼表、量化表、反 DCT、色度上采样与重启标记，那是经典的
# 自伤，而真库里 342 张封面截图正是 jpg。
#
# **它本来就在编译图里**：`eframe` 的剪贴板（`arboard`）要它读图，`png` 那一半一行都不多编
# （同 `ring` 那条：已经在树里的东西，直接依赖比另拉一套便宜）。这里只多开一个 `jpeg`，
# 代价是 `zune-jpeg` 与 `zune-core` 两个纯 Rust 的小 crate，没有 C、不联网。
#
# **只开 png 与 jpeg**：真库的媒体池里图片只有这两种（342 jpg、98 png，
# `docs/library-facts.md`）。gif 与 webp 各要再拉一个解码器，而库里一张都没有——
# 认不出的格式如实说「这一版不解这个格式」，不拿一个猜出来的依赖换。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# **「这个目录写不写得进」要在一个字节都不写的前提下答**（票 `no-mute-spots-opening-a-catalog/04`：
# 添加主库那条向导点「开始扫描」之前，工作目录里一个文件都不写）。那一问是 POSIX 的 `access(2)`，
# 而这个工作区禁 `unsafe`，`libc::access` 用不了——`rustix` 是它的安全封装。
#
# **它本来就在锁文件里**（`tempfile`、`zbus` 等在用），这里只开 `std` 与 `fs`，只在 Unix 上用
# （`crates/core/Cargo.toml` 的 `cfg(unix)`）。Windows 上这一问答不出来，交给建库那一下自己报错
# （挂单 `Q611`）。
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# **系统目录选择器**（票 `gui-answers-all-six/01`，挂单 `Q387`）：开场换工作目录、添加主库向导选第一个根，
# 按一下弹系统的选目录对话框，不必把一条 10 TB 盘上的绝对路径手打进单行框。**只有界面用它**
# （`crates/gui/Cargo.toml`，只在 `src/pick.rs` 里调），核心库与命令行一个依赖都不多。
#
# 选 `rfd` 而不是自己分平台调：三个平台的系统对话框（macOS 的打开面板、Windows 的文件对话框、
# Linux 的 XDG 桌面门户）各是一套 FFI 或 D-Bus 协议，而这个工作区禁 `unsafe`。egui 仓库自己的
# 选文件示例用的也是它。
#
# **关掉默认特性，只开 `xdg-portal`**（只在 Linux 上生效，macOS 与 Windows 走系统自己的对话框）：
# - `xdg-portal`：问 XDG 桌面门户要对话框。说 D-Bus 用的是系统的 `libdbus-1`，但那是**运行时
#   `dlopen`**（`rfd` 0.17.2 的 `portal/ffi.rs`；它的 `build.rs` 在 Linux 上一条链接指令都不发），
#   **编译期不要系统库**——门禁的 CI 在 `ubuntu-latest` 上一个系统包都不装（`.github/workflows/gate.yml`）。
#   **predicted**：本机是 macOS，没在 Linux 上编过，依据是读源码。运行时问不到门户（缺 `libdbus-1`、
#   缺门户服务）时它先退到 `zenity` 命令再试（`xdg_desktop_portal.rs` 的 `pick_folder`），那也没有才
#   交回 `None`——那时两处的输入框就是退路。
# - 默认特性里的 `wayland` 不开：它只为把对话框挂到一扇 Wayland 窗口底下（要递父窗口句柄），
#   这里不递父窗口。
# - `gtk3` 不开：它要链 GTK 的系统库。
#
# **多拉进来的**（锁文件实测）：只有它自己与 `pollster` 0.4——后者只在 Linux 上用，锁文件里另有一份
# 1.0，两版并存。macOS 上复用已有的 `objc2` 0.6 / `objc2-app-kit` 0.3 / `block2` 0.6，Windows 上复用
# `windows-sys` 0.61。
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# **在文件系统中打开**（票 `gui-looks-like-the-design/27`，协调人 2026-09-15 定岔路口 7）：库体检明细里一份文件、一个目录，
# 按一下交给系统的文件管理器打开**它所在的目录**。**只有界面用它**（`crates/gui` 的 `src/health.rs`），核心库与命令行
# 一个依赖都不多。**它本来就在锁文件里**（`egui_kittest` 在用），不多拉进来一个包。
#
# **钉死 `=5.4.4`**：升版得是一次看得见的改动。两个可选特性（`shellexecute-on-windows`、`insecure`）一个不开。
open = "=5.4.4"
# **本地时区**（票 `gui-looks-like-the-design/25`）：任务屏历史那一列照稿画本地时间「09-10 09:12」，得知道这台机器
# 在哪个时区、那一刻比 UTC 快几秒。**只有界面用它**（`crates/gui` 的 `src/task.rs`）；核心库的 `human_time`
# 与命令行照旧 UTC（挂单 `Q901`）。
#
# 为什么是它：这个工作区禁 `unsafe`，`libc::localtime_r` 用不了；`time` 取本地偏移在多线程进程里一律拒绝报
# （界面就是多线程的）。`jiff` 读系统时区库（Unix 上是 `/etc/localtime` 与 `/usr/share/zoneinfo`，Windows 上
# 随包带一份），纯 Rust、不联网。只开读系统时区要的那几个特性，`serde`、`logging` 这类一个不开。
#
# **钉死 `=0.2.37`**：时区换算差一个补丁版就可能差出一个小时，升版得是一次看得见的改动。
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# **截图门**（票 `gui-looks-like-the-design/05`，规格「三层门」的像素层）：界面测试把一屏真的渲染成 PNG，
# 与入库的基线逐像素比。**只有测试用它**（`crates/gui` 的 dev-dependencies，只在 `tests/snapshot.rs` 里用），
# 交付出去的二进制一个字节都不多。
#
# 选它而不是自己拿 `egui-wgpu` 渲一张、再自己写比对：它是 egui 自家的测试库（同一个仓库、同一个版本号发布），
# 渲染走的正是 eframe 开窗那一路的 `egui-wgpu`；比对（`dify`：每像素 YIQ 色距加失败像素数）、对不上时落
# `.new.png` / `.diff.png`、`UPDATE_SNAPSHOTS` 重批基线都是现成的。
#
# **钉死 `=0.36.1`，不写 `0.36`**：0.36.2 要 `egui ^0.36.2`（读它的清单），而锁文件里的 egui 是 0.36.1——
# 放宽的话，加一个测试依赖会顺手把整个界面层的 egui / eframe 抬一个补丁版，而上面 `egui` 那一条钉的
# 正是逐条核实过中文输入的 0.36.1。
#
# **只开 `snapshot` 与 `wgpu`**：`snapshot` 是比对与落图，`wgpu` 是真渲染（没有它只跑布局、渲不出图）。
# `eframe` 不开——测的是一个 `egui::Ui` 画一屏，不起 `eframe::App`；`x11` 不开，不开窗。
#
# **多拉进来的**（锁文件实测，14 个）：它自己、`kittest`（AccessKit 那一层）、`dify`（比对，连带 `rayon` /
# `rayon-core` / `crossbeam-deque` / `crossbeam-epoch`、`colored`、`getopts`、`anyhow`、`lazy_static`）、`open`
# （连带 `is-docker` / `is-wsl`）。`wgpu` 30 / `egui-wgpu` 0.36.1 / `image` 0.25 / `pollster` 1.0 / `tempfile` 3 /
# `accesskit_consumer` 本来就在锁文件里。
# CI 的 ubuntu runner 上没有显卡，`wgpu` 要软件渲染才出得了图——CI 上跑不跑像素层，见票 05。
egui_kittest = { version = "=0.36.1", default-features = false, features = ["snapshot", "wgpu"] }

# 主库只读是这个项目唯一不可退让的约束（ADR-0004），
# 因此禁 unsafe，一切磁盘接触走 `romcat_core::fs::LibraryFs` 这个只读接缝。
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
